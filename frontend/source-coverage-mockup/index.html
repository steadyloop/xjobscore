<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Feed Status · mockup</title>
  <link rel="stylesheet" href="/static/source-coverage/styles.css">
  <link rel="stylesheet" href="/static/navigation.css">
  <style>
    /* One cell per board, grouped by provider. Healthy boards are a quiet tone
       ramp (darker = more jobs); problem states are the only saturated marks,
       sorted to the front of their provider. */
    :root {
      --card: #fffefa;
      --ramp-lo: #d6e0d5;
      --ramp-hi: #5f8f71;
      --st-failing: #b3342b;
      --st-degraded: #c9860f;
      --st-stale: #4f5863;  /* overdue: slate, aging data rather than an error */
      --st-idle: #a9afa8;
    }
    .workspace { max-width: 1480px; }
    /* Header legend: same row as the live page, recoloured to match the wall. */
    .legend-key.ok i { width: 26px; flex-basis: 26px; background: linear-gradient(90deg, var(--ramp-lo), var(--ramp-hi)); }
    .legend-key.failing i { background: var(--st-failing); }
    .legend-key.degraded i { background: var(--st-degraded); }
    .legend-key.stale i { background: var(--st-stale); }
    .legend-key.paused i { background: var(--st-idle); }
    .legend-key.zero { opacity: .45; }
    /* The fleet totals take the section title's place, above the wall they count. */
    #fleet-stats strong { color: var(--ink); }
    .wall-card { margin-top: 16px; }
    .wall { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
    .band { display: grid; gap: 6px; transition: opacity .15s; }
    .band-label { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; }
    .band-label strong { font-size: 13px; line-height: 1.2; }
    .band-label span { color: var(--subtle); font: 500 11px var(--mono); }
    .band-label em { margin-left: auto; font: 600 11px var(--mono); font-style: normal; }
    .band-label em.bad { color: var(--st-failing); }
    .band-label em.warn { color: var(--amber); }
    .band-label em.fine { color: var(--green); font-weight: 500; }
    .band canvas { display: block; cursor: crosshair; }
    .tail-toggle { width: 100%; border: 0; background: transparent; padding: 0; text-align: left; }
    .tail-toggle strong { display: inline-flex; align-items: center; gap: 4px; }
    .tail-toggle .chev { width: 14px; height: 14px; color: var(--subtle); transition: transform .15s; }
    .tail-toggle[aria-expanded="true"] .chev { transform: rotate(90deg); }
    .tail-toggle:hover strong { color: var(--green); }
    .tail-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px 28px; margin-top: 6px; }
    .band.mini { gap: 4px; }
    .band.mini .band-label strong { font-size: 12px; }
    @media (max-width: 1100px) { .tail-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 640px) { .tail-grid { grid-template-columns: minmax(0, 1fr); } }

    .tip { position: fixed; z-index: 50; min-width: 190px; max-width: 300px; pointer-events: none; opacity: 0; transform: translateY(4px); transition: opacity .08s; border: 1px solid var(--line); border-radius: 10px; background: var(--card); padding: 10px 12px; box-shadow: 0 8px 28px rgb(24 33 27 / 14%); font-size: 12px; }
    .tip.on { opacity: 1; transform: none; }
    .tip .t-name { margin-bottom: 7px; font-weight: 700; font-size: 13px; }
    .tip .t-row { display: flex; justify-content: space-between; gap: 18px; color: var(--muted); }
    .tip .t-row b { color: var(--ink); font: 600 12px var(--mono); }
    .st { display: inline-flex; align-items: center; gap: 5px; font-weight: 650; }
    .st svg { width: 13px; height: 13px; stroke-width: 2.2; }
    .st.failing { color: var(--st-failing); }
    .st.degraded { color: var(--amber); }
    .st.stale { color: var(--st-stale); }
    .st.ok { color: var(--green); }

    .state-msg { margin-top: 40px; color: var(--muted); }

    @media (max-width: 760px) {
      .shell { grid-template-columns: minmax(0, 1fr); }
      .sidebar { display: none; }
      .workspace { padding: 22px 16px 40px; }
    }
  </style>
</head>
<body>
  <svg class="icon-sprite" aria-hidden="true">
    <symbol id="icon-opportunities" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
    <symbol id="icon-applications" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></symbol>
    <symbol id="icon-feed-status" viewBox="0 0 24 24"><path d="M3 17V9M9 17V4M15 17v-6M21 17V7"/></symbol>
    <symbol id="icon-resume" viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5"/></symbol>
    <symbol id="st-failing" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m9 9 6 6M15 9l-6 6"/></symbol>
    <symbol id="st-degraded" viewBox="0 0 24 24"><path d="M12 4 3.5 19h17L12 4Z"/><path d="M12 10v3.5M12 16.5h.01"/></symbol>
    <symbol id="st-stale" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="st-ok" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
    <symbol id="st-idle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12h8"/></symbol>
  </svg>

  <div class="shell">
    <aside class="sidebar" aria-label="Primary navigation">
      <a class="brand" href="/"><img class="brand-mark" src="/static/brand-mark.svg?v=20260813" alt="" width="32" height="32"><span class="brand-word">OneShot</span><span class="brand-sub">Application</span></a>
      <nav class="side-nav">
        <p>Discover</p>
        <a href="/"><svg class="nav-icon" aria-hidden="true"><use href="#icon-opportunities"/></svg>Opportunities</a>
        <p>Track</p>
        <a href="/application/"><svg class="nav-icon" aria-hidden="true"><use href="#icon-applications"/></svg>Applications</a>
        <a href="/resume/"><svg class="nav-icon" aria-hidden="true"><use href="#icon-resume"/></svg>Resume</a>
        <p>System</p>
        <a class="active" href="/source-coverage/" aria-current="page"><svg class="nav-icon" aria-hidden="true"><use href="#icon-feed-status"/></svg>Feed Status</a>
      </nav>
    </aside>

    <main class="workspace" id="workspace">
      <header class="page-header">
        <h1>Feed Status</h1>
        <span id="clock" class="clock" aria-label="Current time">—</span>
      </header>

      <section class="source-section" aria-labelledby="fleet-stats">
        <header class="section-header">
          <div class="section-title"><h2 id="fleet-stats">Loading fleet…</h2></div>
          <div class="legend-row" aria-label="Board states">
            <span class="legend-key ok" title="Healthy. Darker = more jobs on the board (0 → 10k+)."><i aria-hidden="true"></i>ok <b data-state-count="ok">—</b></span>
            <span class="legend-key failing" title="3+ polls in a row failed."><i aria-hidden="true"></i>failing <b data-state-count="failing">—</b></span>
            <span class="legend-key degraded" title="The last 1–2 polls failed; it will try again."><i aria-hidden="true"></i>retrying <b data-state-count="degraded">—</b></span>
            <span class="legend-key stale" title="Missed its scheduled check (over 3× its normal interval)."><i aria-hidden="true"></i>overdue <b data-state-count="stale">—</b></span>
            <span class="legend-key paused"><i aria-hidden="true"></i>paused <b data-state-count="paused">—</b></span>
            <span class="legend-key never"><i aria-hidden="true"></i>never polled <b data-state-count="never">—</b></span>
          </div>
        </header>
        <div id="root"><p class="state-msg">Loading…</p></div>
      </section>
    </main>
  </div>
  <div class="tip" id="tip" role="tooltip"></div>

<script>
(function () {
  "use strict";

  const PITCH = 4;          // cell + 1px gap
  const CELL = 3;
  const NAMED = 6;          // providers with their own band; the rest share one
  const REFRESH_MS = 60000;
  const SEVERITY = { failing: 0, degraded: 1, stale: 2, paused: 3, never: 4, ok: 9 };
  // The API's state keys stay as-is; these are the words users see.
  const STATE_LABEL = { failing: "failing", degraded: "retrying", stale: "overdue", paused: "paused", never: "never polled", ok: "healthy" };

  const $ = s => document.querySelector(s);
  const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const fmt = n => new Intl.NumberFormat().format(Math.round(Number(n) || 0));
  const compact = n => new Intl.NumberFormat(undefined, { notation: "compact", maximumFractionDigits: 1 }).format(Number(n) || 0);
  const clock = d => d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
  // Many boards poll on a 30-day interval, so anything not from today carries its date.
  const polledAt = iso => {
    if (!iso) return "never";
    const d = new Date(iso), now = new Date();
    const mins = Math.max(0, Math.round((now - d) / 60000));
    const rel = mins < 60 ? `${mins}m ago` : mins < 1440 ? `${Math.floor(mins / 60)}h ago` : `${Math.floor(mins / 1440)}d ago`;
    const when = d.toDateString() === now.toDateString()
      ? clock(d)
      : d.toLocaleDateString(undefined, { month: "short", day: "numeric" }) + ", " + clock(d);
    return `${when} · ${rel}`;
  };
  const icon = state => `<svg aria-hidden="true"><use href="#st-${state === "paused" || state === "never" ? "idle" : state}"/></svg>`;
  const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));

  let data = null;         // { boards, bands }
  let palette = null;

  // ---------- model ----------
  function model(payload) {
    const boards = [];
    for (const p of payload.providers || []) {
      for (const b of p.boards || []) {
        const state = SEVERITY[b.state] !== undefined ? b.state : "never";
        boards.push({ source: p.source, key: b.key, company: b.company || b.key, state, strikes: +b.strikes || 0, roles: +b.coverage || 0, last: b.last_poll_at });
      }
    }
    const bySource = new Map();
    for (const b of boards) {
      if (!bySource.has(b.source)) bySource.set(b.source, { source: b.source, boards: [], roles: 0, problems: {} });
      const g = bySource.get(b.source);
      g.boards.push(b); g.roles += b.roles;
      if (b.state !== "ok") g.problems[b.state] = (g.problems[b.state] || 0) + 1;
    }
    const groups = [...bySource.values()].sort((a, b) => b.roles - a.roles);

    // Bands: the NAMED providers with the most boards get their own row; the long tail shares one.
    const named = new Set([...groups].sort((a, b) => b.boards.length - a.boards.length).slice(0, NAMED).map(g => g.source));
    const bands = groups.filter(g => named.has(g.source)).map(g => ({ ...g, label: g.source }));
    const tail = groups.filter(g => !named.has(g.source));
    if (tail.length) {
      const t = { source: "__tail", label: `+${tail.length} more providers`, boards: tail.flatMap(g => g.boards), roles: tail.reduce((s, g) => s + g.roles, 0), problems: {} };
      for (const g of tail) for (const [k, v] of Object.entries(g.problems)) t.problems[k] = (t.problems[k] || 0) + v;
      t.groups = tail.map(g => ({ ...g, label: g.source }));
      bands.push(t);
    }
    // Problems first (worst first), then healthy boards heaviest first: each band reads as a gradient
    // with its trouble pinned to the top-left corner.
    const byWeight = list => [...list].sort((a, b) => (SEVERITY[a.state] - SEVERITY[b.state]) || (b.roles - a.roles));
    const byId = new Map();
    for (const band of bands) {
      band.boards = byWeight(band.boards);
      byId.set(band.source, band);
      for (const g of band.groups || []) { g.boards = byWeight(g.boards); byId.set(`tail:${g.source}`, g); }
    }
    return { boards, bands, byId };
  }

  // ---------- colour ----------
  function readPalette() {
    const lo = hex(css("--ramp-lo")), hi = hex(css("--ramp-hi"));
    const maxLog = Math.log1p(10000);  // 10k+ roles saturates the ramp
    const ramp = roles => {
      const t = Math.min(1, Math.log1p(roles) / maxLog);
      return `rgb(${lo.map((c, i) => Math.round(c + (hi[i] - c) * t)).join(",")})`;
    };
    palette = { ramp, failing: css("--st-failing"), degraded: css("--st-degraded"), stale: css("--st-stale"), idle: css("--st-idle") };
  }
  const cellColor = b => b.state === "ok" ? palette.ramp(b.roles) : b.state === "paused" || b.state === "never" ? palette.idle : palette[b.state];

  function problemText(problems) {
    return ["failing", "degraded", "stale", "paused", "never"].filter(s => problems[s]).map(s => `${problems[s]} ${STATE_LABEL[s]}`).join(" · ");
  }

  // ---------- render ----------
  function renderHeader() {
    const roles = data.boards.reduce((sum, b) => sum + b.roles, 0);
    const providers = new Set(data.boards.map(b => b.source)).size;
    $("#fleet-stats").innerHTML = `<strong>${fmt(data.boards.length)}</strong> boards / <strong>${fmt(providers)}</strong> providers<span class="stat-sep" aria-hidden="true"> · </span><strong>${fmt(roles)}</strong> jobs`;
    const counts = {};
    for (const b of data.boards) counts[b.state] = (counts[b.state] || 0) + 1;
    document.querySelectorAll("[data-state-count]").forEach(slot => {
      const n = counts[slot.dataset.stateCount] || 0;
      slot.textContent = fmt(n);
      slot.closest(".legend-key").classList.toggle("zero", n === 0);
    });
  }

  let tailOpen = false;

  function bandMarkup(band, id, mini = false) {
    const prob = problemText(band.problems);
    const cls = band.problems.failing ? "bad" : (band.problems.degraded || band.problems.stale) ? "warn" : "fine";
    const canvas = `<canvas role="img" aria-label="${esc(band.label)}: ${fmt(band.boards.length)} boards${prob ? ", " + esc(prob) : ""}"></canvas>`;
    const n = band.boards.length;
    const meta = `<span>${fmt(n)} ${n === 1 ? "board" : "boards"} · ${compact(band.roles)} ${band.roles === 1 ? "job" : "jobs"}</span>
      <em class="${cls}">${prob ? esc(prob) : mini ? "" : "all healthy"}</em>`;
    if (!band.groups) {
      return `<div class="band${mini ? " mini" : ""}" data-id="${esc(id)}"><div class="band-label"><strong>${esc(band.label)}</strong>${meta}</div>${canvas}</div>`;
    }
    const toggle = `<button type="button" class="band-label tail-toggle" aria-expanded="${tailOpen}"><strong>${esc(band.label)}<svg class="chev" aria-hidden="true" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg></strong>${meta}</button>`;
    return tailOpen
      ? `<div class="band tail">${toggle}<div class="tail-grid">${band.groups.map(g => bandMarkup(g, `tail:${g.source}`, true)).join("")}</div></div>`
      : `<div class="band tail" data-id="${esc(id)}">${toggle}${canvas}</div>`;
  }

  function render() {
    renderHeader();
    $("#root").innerHTML = `
      <section class="wall-card" aria-label="Boards by provider">
        <div class="wall" id="wall">${data.bands.map(band => bandMarkup(band, band.source)).join("")}</div>
      </section>`;
    layoutWall();
    $(".tail-toggle")?.addEventListener("click", () => { tailOpen = !tailOpen; render(); });
    document.querySelectorAll(".band[data-id] > canvas").forEach(canvas => {
      const band = data.byId.get(canvas.parentElement.dataset.id);
      canvas.addEventListener("pointermove", e => {
        const r = canvas.getBoundingClientRect();
        const b = pickBoard(band, e.clientX - r.left, e.clientY - r.top);
        b ? showTip(b, e.clientX, e.clientY) : hideTip();
      });
      canvas.addEventListener("pointerleave", hideTip);
    });
  }

  // ---------- wall ----------
  function layoutWall() {
    const ratio = window.devicePixelRatio || 1;
    document.querySelectorAll(".band[data-id]").forEach(el => {
      const band = data.byId.get(el.dataset.id);
      const canvas = el.querySelector(":scope > canvas");
      const cols = band.cols = Math.max(8, Math.floor((el.clientWidth + (PITCH - CELL)) / PITCH));
      const rows = Math.ceil(band.boards.length / cols);
      const w = cols * PITCH, h = rows * PITCH;
      canvas.width = w * ratio; canvas.height = h * ratio;
      canvas.style.width = `${w}px`; canvas.style.height = `${h}px`;
      const ctx = canvas.getContext("2d");
      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
      ctx.clearRect(0, 0, w, h);
      band.boards.forEach((b, i) => {
        ctx.fillStyle = cellColor(b);
        ctx.fillRect((i % cols) * PITCH, Math.floor(i / cols) * PITCH, CELL, CELL);
      });
    });
  }

  function pickBoard(band, x, y) {
    const n = band.boards.length, wallCols = band.cols;
    const col = Math.floor(x / PITCH), row = Math.floor(y / PITCH);
    const best = row * wallCols + col;
    if (best >= n || col >= wallCols) return null;
    if (band.boards[best].state !== "ok") return band.boards[best];
    // Problem cells are what a pointer crossing the wall is aiming for; snap to one within 2 cells.
    let bestD = Infinity, snap = null;
    for (let dr = -2; dr <= 2; dr++) for (let dc = -2; dc <= 2; dc++) {
      const r = row + dr, c = col + dc, i = r * wallCols + c;
      if (r < 0 || c < 0 || c >= wallCols || i >= n || band.boards[i].state === "ok") continue;
      const dist = Math.hypot(dr, dc);
      if (dist < bestD) { bestD = dist; snap = band.boards[i]; }
    }
    return snap || band.boards[best];
  }

  function showTip(b, cx, cy) {
    const tip = $("#tip");
    const st = b.state;
    tip.innerHTML = `<div class="t-name">${esc(b.company)}</div>
      <div class="t-row"><span>status</span><span class="st ${st === "paused" || st === "never" ? "" : st}">${icon(st)}${STATE_LABEL[st]}</span></div>
      <div class="t-row"><span>jobs</span><b>${fmt(b.roles)}</b></div>
      ${b.strikes ? `<div class="t-row"><span>strikes</span><b>${b.strikes}</b></div>` : ""}
      <div class="t-row"><span>last polled</span><b>${polledAt(b.last)}</b></div>`;
    tip.classList.add("on");
    const w = tip.offsetWidth, h = tip.offsetHeight;
    let x = cx + 16, y = cy + 16;
    if (x + w > innerWidth - 8) x = cx - w - 16;
    if (y + h > innerHeight - 8) y = cy - h - 16;
    tip.style.left = `${Math.max(8, x)}px`; tip.style.top = `${Math.max(8, y)}px`;
  }
  const hideTip = () => $("#tip").classList.remove("on");

  // ---------- data ----------
  async function load() {
    try {
      const r = await fetch("/api/source-coverage/boards");
      if (!r.ok) throw new Error(`boards ${r.status}`);
      const payload = await r.json();
      readPalette();
      data = model(payload);
      render();
    } catch (error) {
      if (!data) $("#root").innerHTML = `<p class="state-msg">Could not load live data (${esc(error.message)}). Open this page from the OneShot server: <code>http://127.0.0.1:8766/static/source-coverage-mockup/index.html</code></p>`;
    }
  }
  const CLOCK_FORMAT = new Intl.DateTimeFormat(undefined, { hour: "numeric", minute: "2-digit", second: "2-digit", hour12: true, timeZoneName: "short" });
  const tick = () => { $("#clock").textContent = CLOCK_FORMAT.format(new Date()); };
  tick();
  setInterval(tick, 1000);
  setInterval(() => { if (!document.hidden) load(); }, REFRESH_MS);
  let resizeTimer = 0;
  addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => { if (data) layoutWall(); }, 100); });
  load();
})();
</script>
</body>
</html>
