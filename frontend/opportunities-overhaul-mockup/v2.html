<title>Opportunities Feed v2</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<style>
/* Second pass. Everything the first pass added has been cut back out unless it
   survives one test: does a student act differently because of it? Tokens are
   copied from frontend/opportunities/styles.css so this ports without a palette
   decision. Mock data. */
:root {
  --paper: #fffefa;
  --ground: #f4f3ee;
  --sunk: #ecebe2;
  --ink: #18211b;
  --muted: #626b64;
  --faint: #7c847e;
  --line: #dddfd6;
  --line-strong: #c7cbc0;
  --edge: #eeede6;
  --nav: #15251e;
  --nav-raised: #22372d;
  --lime: #d9f36a;
  --green: #28704f;
  --green-soft: #e3f2e8;
  --green-deep: #1c5238;
  --amber: #985c13;
  --amber-soft: #fdf0dc;
  --sans: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme: light;
}

* { box-sizing: border-box; }
html { background: var(--ground); }
body { margin: 0; background: var(--ground); color: var(--ink); font: 13px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
button, input, select { color: inherit; font: inherit; }
button, select { cursor: pointer; }
a { color: inherit; text-decoration: none; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }

.shell { min-height: 100vh; display: grid; grid-template-columns: 208px minmax(0, 1fr); }
.sidebar { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 2px; background: var(--nav); padding: 20px 11px; color: #eff4ef; }
.brand { display: flex; align-items: center; gap: 8px; padding: 0 9px 16px; font-size: 14px; font-weight: 780; letter-spacing: -.02em; }
.brand span { display: grid; place-items: center; width: 21px; height: 21px; border-radius: 6px; background: var(--lime); color: var(--nav); font: 800 10px var(--mono); }
.side-label { margin: 14px 10px 4px; color: rgb(255 255 255 / 38%); font: 9px var(--mono); letter-spacing: .12em; text-transform: uppercase; }
.side-nav-link { display: flex; align-items: center; gap: 9px; border-radius: 7px; padding: 7px 10px; color: rgb(255 255 255 / 66%); font-size: 12.5px; font-weight: 550; }
.side-nav-link:hover { background: var(--nav-raised); color: #fff; }
.side-nav-link.active { background: var(--nav-raised); color: #fff; font-weight: 650; }
.side-nav-link.active svg { color: var(--lime); }
.side-nav-link svg { width: 16px; height: 16px; flex: 0 0 16px; }
.side-nav-link b { margin-left: auto; border-radius: 20px; background: rgb(255 255 255 / 10%); padding: 1px 6px; font: 400 9.5px var(--mono); }

.view { width: 100%; max-width: 1330px; padding: 32px 34px 70px 46px; }

/* Head is a kicker and a name. The stat tiles are gone. */
.kicker { color: var(--green); font: 750 9.5px/1.3 var(--mono); letter-spacing: .13em; text-transform: uppercase; }
h1 { margin-top: 5px; font-size: 30px; line-height: 1.05; letter-spacing: -.045em; }

.controls { border-bottom: 1px solid var(--line); margin-top: 22px; }
.tabs { display: flex; align-items: center; gap: 22px; flex-wrap: wrap; }
.tab { position: relative; display: inline-flex; align-items: baseline; gap: 6px; border: 0; background: transparent; padding: 0 1px 11px; color: var(--muted); font-size: 13px; font-weight: 640; }
.tab:hover { color: var(--ink); }
.tab.on { color: var(--ink); font-weight: 720; }
.tab.on::after { position: absolute; right: 0; bottom: -1px; left: 0; height: 2px; border-radius: 3px 3px 0 0; background: var(--ink); content: ""; }
.tab-n { color: var(--faint); font: 700 10px/1 var(--mono); font-variant-numeric: tabular-nums; }
.tab.on .tab-n { color: var(--green); }

/* No label. The × on the active chip is the affordance that says a filter is on. */
.facets { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; padding: 11px 0 12px; }
.chip { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--line-strong); border-radius: 999px; background: var(--paper); padding: 4px 10px; color: var(--muted); font-size: 11px; font-weight: 640; }
.chip:hover { border-color: var(--ink); color: var(--ink); }
.chip.on { border-color: var(--green); background: var(--green-soft); color: var(--green-deep); font-weight: 700; }
.chip.on::after { content: "×"; font: 700 12px/1 var(--mono); opacity: .5; }

.searchbar { display: flex; align-items: center; gap: 9px; margin-top: 16px; }
.search { height: 39px; flex: 1; min-width: 0; display: flex; align-items: center; gap: 9px; border: 1px solid var(--line); border-radius: 10px; background: var(--paper); padding: 0 11px; color: var(--faint); }
.search:focus-within { border-color: var(--green); box-shadow: 0 0 0 3px rgb(40 112 79 / 10%); }
.search svg { width: 16px; height: 16px; flex: 0 0 16px; stroke-width: 2; }
.search input { width: 100%; height: 37px; border: 0; outline: 0; background: transparent; color: var(--ink); font-size: 13.5px; }
.search kbd { flex: 0 0 auto; border: 1px solid var(--line); border-radius: 5px; background: var(--ground); padding: 2px 6px; font: 9.5px/1.4 var(--mono); white-space: nowrap; }
.sort { height: 39px; border: 1px solid var(--line); border-radius: 10px; background: var(--paper); padding: 0 8px; color: var(--muted); font-size: 12px; font-weight: 640; }

.grid { display: grid; grid-template-columns: minmax(430px, 1fr) minmax(360px, 448px); gap: 24px; align-items: start; margin-top: 16px; }
.feed { min-width: 0; display: grid; align-content: start; gap: 5px; }

.daymark { position: sticky; top: 0; z-index: 3; display: flex; align-items: center; gap: 11px; margin: 13px 0 3px; padding: 6px 0 5px; background: linear-gradient(var(--ground) 72%, rgb(244 243 238 / 0%)); color: var(--faint); font: 700 9.5px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; }
.daymark:first-child { margin-top: 0; }
.daymark::after { flex: 1; height: 1px; background: var(--line); content: ""; }

/* Three tight rows and a right-hand age. No shadow — the border alone separates,
   and dropping it lets the cards sit closer without the page feeling stacked. */
.op { position: relative; display: grid; grid-template-columns: 32px minmax(0, 1fr) 34px; align-items: start; gap: 11px; border: 1px solid var(--line); border-radius: 11px; background: var(--paper); padding: 9px 12px 9px 13px; text-align: left; transition: border-color .16s ease, box-shadow .16s ease; }
.op::before { position: absolute; top: 9px; bottom: 9px; left: 0; width: 2px; border-radius: 0 3px 3px 0; background: transparent; content: ""; transition: background-color .16s ease; }
.op:hover { border-color: var(--line-strong); box-shadow: 0 3px 14px rgb(24 33 27 / 6%); }
.op.on { border-color: var(--line-strong); box-shadow: 0 3px 14px rgb(24 33 27 / 7%); }
.op.on::before { background: var(--green); }

.op-logo { width: 32px; height: 32px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 8px; background: #f8f8f4; overflow: hidden; font: 800 10px var(--mono); }
.op-body { min-width: 0; }
.op-body h3 { overflow: hidden; font-size: 13.5px; font-weight: 640; line-height: 1.3; letter-spacing: -.017em; text-overflow: ellipsis; white-space: nowrap; }
.op-meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 2px; color: var(--muted); font-size: 11px; line-height: 1.4; }
.op-co { color: var(--ink); font-weight: 700; letter-spacing: -.005em; }
.op-meta .sep { color: var(--line-strong); }
.op-tags { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 5px; }
.tag { border-radius: 4px; background: var(--sunk); padding: 1px 6px; color: #58625c; font: 600 9.5px/1.5 var(--mono); }

.wp { display: inline-flex; align-items: center; gap: 4px; font-weight: 640; }
.wp svg { width: 12px; height: 12px; flex: 0 0 12px; stroke-width: 2; }
.wp[data-wp="remote"] { color: var(--green); font-weight: 700; }
.wp[data-wp="hybrid"] { color: var(--muted); }
.wp[data-wp="onsite"] { color: var(--faint); }
.wp[data-wp="unknown"] { color: var(--faint); font-style: italic; font-weight: 500; }

/* The one thing on a card that expires. Nothing else here is a countdown. */
.due { display: inline-flex; align-items: center; gap: 4px; border-radius: 4px; background: var(--amber-soft); padding: 0 5px; color: var(--amber); font: 700 10px/1.6 var(--mono); }
.due svg { width: 11px; height: 11px; flex: 0 0 11px; stroke-width: 2.2; }

.state-badge { border-radius: 4px; padding: 1px 5px; font: 800 8.5px/1.6 var(--mono); letter-spacing: .07em; text-transform: uppercase; }
.state-badge.saved { background: var(--sunk); color: var(--muted); }
.state-badge.applied { background: var(--ink); color: #eff4ef; }

/* One number, right-aligned, tabular. The whole feed shares this edge. */
.op-rail { position: relative; justify-self: end; padding-top: 2px; text-align: right; }
.op-age { color: var(--muted); font: 650 11.5px/1 var(--mono); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.op.fresh .op-age { color: var(--ink); font-weight: 750; }
.op-acts { position: absolute; top: -4px; right: -3px; display: flex; gap: 3px; padding: 3px; border-radius: 8px; background: var(--paper); opacity: 0; transition: opacity .14s ease; pointer-events: none; }
.op:hover .op-acts, .op:focus-within .op-acts { opacity: 1; pointer-events: auto; }
.op-acts button { display: grid; place-items: center; width: 24px; height: 24px; border: 1px solid var(--line); border-radius: 7px; background: var(--paper); color: var(--muted); }
.op-acts button:hover { border-color: var(--ink); color: var(--ink); }
.op-acts svg { width: 13px; height: 13px; }
.op.is-applied { background: #fbfaf5; }
.op.is-applied .op-body h3 { color: var(--muted); }

.pager { display: flex; align-items: center; justify-content: center; margin-top: 14px; }
.pager button { border: 1px solid var(--line-strong); border-radius: 9px; background: var(--paper); padding: 8px 16px; font-size: 12px; font-weight: 640; }
.pager button:hover { border-color: var(--ink); }

/* ---------- detail ---------- */
.detail { position: sticky; top: 14px; max-height: calc(100vh - 28px); overflow-y: auto; border: 1px solid var(--line); border-radius: 14px; background: var(--paper); box-shadow: 0 4px 18px rgb(24 33 27 / 5%); scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent; }
.d-head { display: grid; grid-template-columns: minmax(0, 1fr) 42px; gap: 14px; padding: 18px 18px 0; }
.d-co { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; color: var(--muted); font-size: 11.5px; }
.d-co b { color: var(--ink); font-weight: 720; }
.d-co .sep { color: var(--line-strong); }
.d-head h2 { margin-top: 5px; font-size: 19px; line-height: 1.2; letter-spacing: -.03em; }
.d-logo { width: 42px; height: 42px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 10px; background: #f8f8f4; overflow: hidden; font: 800 12px var(--mono); }

/* One line, not a panel: posted when, and whether the link still resolves. */
.d-live { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; margin: 10px 18px 0; color: var(--muted); font: 10.5px/1.6 var(--mono); }
.d-live b { color: var(--ink); font-weight: 700; }
.d-live .ok { display: inline-flex; align-items: center; gap: 4px; color: var(--green); font-weight: 700; }
.d-live .ok svg { width: 11px; height: 11px; stroke-width: 2.6; }
.d-live .sep { color: var(--line-strong); }

.d-acts { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; padding: 14px 18px 16px; }
.btn { min-height: 38px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line-strong); border-radius: 9px; background: var(--paper); padding: 8px 13px; font-size: 12px; font-weight: 660; }
.btn:hover { border-color: #8f968e; }
.btn svg { width: 14px; height: 14px; }
.btn.primary { border-color: var(--green); background: var(--green); color: #fff; font-weight: 700; }
.btn.primary:hover { border-color: var(--green-deep); background: var(--green-deep); }
.btn.icon { padding: 8px 10px; }

.d-sec { border-top: 1px solid var(--edge); padding: 15px 18px; }
.d-eyebrow { color: var(--faint); font: 750 8.5px/1 var(--mono); letter-spacing: .13em; text-transform: uppercase; }

.skills { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 11px; }
.skill { border: 1px solid var(--line); border-radius: 5px; background: var(--paper); padding: 3px 7px; font: 640 10.5px/1.5 var(--mono); }
.skill.core { border-color: #cbe2d3; background: var(--green-soft); color: var(--green-deep); font-weight: 700; }

.summary { max-width: 58ch; margin-top: 10px; color: var(--muted); font-size: 12px; line-height: 1.72; }
.summary.none { color: var(--faint); font-style: italic; }

.srcs { display: grid; gap: 1px; margin-top: 10px; }
.src { display: flex; align-items: center; gap: 9px; border-radius: 8px; padding: 7px 8px; }
.src:hover { background: var(--ground); }
.src-n { flex: 1; min-width: 0; font-size: 12px; font-weight: 620; }
.src-n small { display: block; margin-top: 1px; color: var(--faint); font: 500 9.5px var(--mono); }
.src-tag { border-radius: 4px; background: var(--sunk); padding: 2px 5px; color: var(--muted); font: 700 8.5px/1.4 var(--mono); letter-spacing: .06em; text-transform: uppercase; }
.src-tag.prime { background: var(--green-soft); color: var(--green-deep); }
.src svg { width: 13px; height: 13px; color: var(--faint); }

/* ---------- notes (mockup affordance, not part of the design) ---------- */
.notes-btn { position: fixed; right: 18px; bottom: 18px; z-index: 30; display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--nav); border-radius: 10px; background: var(--nav); padding: 10px 14px; color: #fff; font-size: 12px; font-weight: 660; box-shadow: 0 8px 26px rgb(24 33 27 / 22%); }
.notes-btn svg { width: 15px; height: 15px; color: var(--lime); }
.notes { position: fixed; top: 0; right: 0; z-index: 29; width: 352px; max-width: 92vw; height: 100vh; overflow-y: auto; border-left: 1px solid var(--line); background: var(--paper); padding: 22px 20px 92px; transform: translateX(100%); transition: transform .28s cubic-bezier(.4,0,.2,1); box-shadow: -12px 0 40px rgb(24 33 27 / 10%); }
body.notes-on .notes { transform: none; }
.notes h2 { font-size: 17px; letter-spacing: -.03em; }
.notes h3 { margin-top: 20px; color: var(--faint); font: 750 8.5px/1 var(--mono); letter-spacing: .13em; text-transform: uppercase; }
.notes > p { margin: 7px 0 4px; color: var(--muted); font-size: 11.5px; line-height: 1.6; }
.note { display: grid; grid-template-columns: 20px 1fr; gap: 10px; border-top: 1px solid var(--edge); padding: 11px 4px; cursor: pointer; }
.note:hover { background: var(--ground); }
.note-n { display: grid; place-items: center; width: 20px; height: 20px; border-radius: 6px; background: var(--sunk); color: var(--muted); font: 700 9.5px var(--mono); }
.note:hover .note-n { background: var(--green); color: #fff; }
.note b { display: block; font-size: 12px; font-weight: 680; }
.note span { display: block; margin-top: 3px; color: var(--muted); font-size: 11px; line-height: 1.55; }
.cut { display: grid; grid-template-columns: 14px 1fr; gap: 9px; padding: 7px 4px; border-top: 1px solid var(--edge); color: var(--muted); font-size: 11px; line-height: 1.5; }
.cut i { color: var(--faint); font-style: normal; }
.cut b { color: var(--ink); font-weight: 660; }
body[data-hi] [data-note] { transition: box-shadow .18s ease; }
body[data-hi="1"] [data-note="1"], body[data-hi="2"] [data-note="2"], body[data-hi="3"] [data-note="3"],
body[data-hi="4"] [data-note="4"], body[data-hi="5"] [data-note="5"], body[data-hi="6"] [data-note="6"],
body[data-hi="7"] [data-note="7"] { border-radius: 8px; box-shadow: 0 0 0 2px var(--green), 0 0 0 7px rgb(40 112 79 / 14%); }

@media (max-width: 1120px) { .grid { grid-template-columns: 1fr; } .detail { position: static; max-height: none; } }
@media (max-width: 820px) { .shell { grid-template-columns: 1fr; } .sidebar { display: none; } .view { padding: 22px 16px 80px; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: .01ms !important; } }
</style>

const DAYS = { today:"Opened today", yest:"Opened yesterday", sep7:"Opened Sep 7", sep6:"Opened Sep 6" };
const WP = { remote:["i-remote","Remote"], hybrid:["i-hybrid","Hybrid"], onsite:["i-onsite","On-site"], unknown:["i-pin","Workplace not stated"] };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));

let selected = 1, query = "";

function card(j) {
  const [ico, label] = WP[j.wp];
  const state = j.state === "applied" ? '<span class="state-badge applied">Applied</span>'
    : j.state === "saved" ? '<span class="state-badge saved">Saved</span>' : "";
  const due = j.due ? `<span class="due"><svg><use href="#i-clock"/></svg>${esc(j.due)}</span>` : "";
  const tags = j.skills.slice(0, 3).map(s => `<span class="tag">${esc(s[0])}</span>`).join("");
  return `<article class="op ${j.id === selected ? "on" : ""} ${j.day === "today" ? "fresh" : ""} ${j.state === "applied" ? "is-applied" : ""}" data-id="${j.id}" tabindex="0" role="button" aria-pressed="${j.id === selected}">
    <div class="op-logo" style="color:${j.tint}">${esc(j.logo)}</div>
    <div class="op-body">
      <h3 ${j.id === 3 ? 'data-note="2"' : ""}>${esc(j.title)}</h3>
      <div class="op-meta">
        <span class="op-co">${esc(j.co)}</span>
        <span class="sep">·</span><span>${esc(j.loc)}</span>
        <span class="sep">·</span><span class="wp" data-wp="${j.wp}" ${j.id === 6 ? 'data-note="3"' : ""}><svg><use href="#${ico}"/></svg>${esc(label)}</span>
        ${state}${due}
      </div>
      <div class="op-tags">${tags}</div>
    </div>
    <div class="op-rail" ${j.id === 3 ? 'data-note="1"' : ""}>
      <span class="op-age">${esc(j.age)}</span>
      <span class="op-acts">
        <button title="Save" aria-label="Save"><svg><use href="#i-save"/></svg></button>
        <button title="Not interested" aria-label="Not interested"><svg><use href="#i-hide"/></svg></button>
      </span>
    </div>
  </article>`;
}

function renderFeed() {
  const q = query.trim().toLowerCase();
  const list = JOBS.filter(j => !q || (j.title + " " + j.co + " " + j.skills.map(s => s[0]).join(" ")).toLowerCase().includes(q));
  let day = null, html = "";
  for (const j of list) {
    if (j.day !== day) { day = j.day; html += `<div class="daymark" ${day === "today" ? 'data-note="5"' : ""}>${esc(DAYS[day])}</div>`; }
    html += card(j);
  }
  html += `<div class="pager"><button>Load more</button></div>`;
  document.getElementById("feed").innerHTML = list.length ? html : `<div class="daymark">No matches</div>`;
}

function renderDetail() {
  const j = JOBS.find(x => x.id === selected) || JOBS[0];
  const srcs = j.sources.map(([n, t, prime]) => `<a class="src" href="#">
      <span class="src-tag ${prime ? "prime" : ""}">${prime ? "Primary" : "Mirror"}</span>
      <span class="src-n">${esc(n)}<small>checked ${esc(t)} ago</small></span>
      <svg><use href="#i-ext"/></svg></a>`).join("");
  const skills = j.skills.map(([s, core]) => `<span class="skill ${core ? "core" : ""}">${esc(s)}</span>`).join("");
  document.getElementById("detail").innerHTML = `
    <div class="d-head">
      <div>
        <div class="d-co"><b>${esc(j.co)}</b><span class="sep">·</span><span>${esc(j.loc)}</span></div>

    <div class="d-live" data-note="4">

      <span class="sep">·</span>
      <span class="ok"><svg><use href="#i-check"/></svg>Link live ${esc(j.check)} ago</span>
    </div>
    <div class="d-acts">
      <a class="btn primary" href="#">Apply on ${esc(j.sources[0][0])} <svg><use href="#i-ext"/></svg></a>
      <button class="btn">${j.state === "applied" ? "Tracked" : "Track"}</button>
      <button class="btn icon" title="Save" aria-label="Save"><svg><use href="#i-save"/></svg></button>
    </div>
    <section class="d-sec">
      <div class="d-eyebrow">Skills</div>

    </section>
    <section class="d-sec">
      <div class="d-eyebrow">Where this is posted</div>
      <div class="srcs">${srcs}</div>
    </section>`;
}

  ["The four stat tiles", "Live now / opened today / boards / last sweep. Dashboard furniture — nothing on it changed a decision."],
  ["The FOCUS AREA label", "The × on the active chip already says a filter is on, and says how to drop it."],

  ["The NEW badge", "The day rule says opened today and the age column says 4h. A third copy of the same fact."],
  ["At a glance", "Term, workplace, level, apply by — all downstream of a filter you already set."],
  ["The density toggle", "There is one density now, and it is the tight one."]
];

const NOTES = [
  [1, "The age column", "One number per card, right-aligned, tabular mono, dark for today and grey after. It is the only new thing on the card, it is what the sort is ordered by, and it forms the vertical line that makes the feed scannable."],
  [2, "Title first", "The role is what you scan for. The logo already carries the brand, so the company drops to the meta line."],
  [3, "Green means remote", "Remote gets the globe and the only green in the row. Hybrid gets a half disc, on-site a building, and unknown says so rather than rendering nothing."],
  [4, "Liveness, once, in words", "Link live 6m ago in the detail pane. Dead links are the failure mode of every aggregator, so the claim is worth one line — but only one, and only where you are deciding."],
  [5, "Sticky day rules", "They pin while you scroll 900 rows. Because the rule says opened today, the per-card footline and its divider are gone."],
  [6, "Research tab", "All read 910 while the visible tabs summed to 881. The research bucket had no tab, so 29 jobs were reachable only through All."],
  [7, "Software is pre-selected", "It always was — the label saying so was set to display:none. The × makes the filter visible and removable without adding a row of chrome."]

document.getElementById("cutList").innerHTML = CUTS.map(([t, d]) => `<div class="cut"><i>—</i><div><b>${t}</b> ${d}</div></div>`).join("");
document.getElementById("noteList").innerHTML = NOTES.map(([n, t, d]) =>
  `<div class="note" data-n="${n}"><span class="note-n">${n}</span><div><b>${t}</b><span>${d}</span></div></div>`).join("");

const feed = document.getElementById("feed");
feed.addEventListener("click", e => {
  if (e.target.closest(".op-acts")) { e.stopPropagation(); return; }
  const op = e.target.closest(".op");
  if (!op) return;
  selected = Number(op.dataset.id);
  renderFeed(); renderDetail();
});
feed.addEventListener("keydown", e => {
  const op = e.target.closest(".op");
  if (op && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); selected = Number(op.dataset.id); renderFeed(); renderDetail(); }
});
document.getElementById("q").addEventListener("input", e => { query = e.target.value; renderFeed(); });
document.getElementById("notesBtn").addEventListener("click", () => document.body.classList.toggle("notes-on"));
document.getElementById("noteList").addEventListener("mouseover", e => {
  const n = e.target.closest(".note"); if (n) document.body.dataset.hi = n.dataset.n;
});
document.getElementById("noteList").addEventListener("mouseleave", () => { delete document.body.dataset.hi; });
document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => {
  document.querySelectorAll(".tab").forEach(x => { x.classList.remove("on"); x.setAttribute("aria-selected", "false"); });
  t.classList.add("on"); t.setAttribute("aria-selected", "true");
}));
document.querySelectorAll(".chip").forEach(c => c.addEventListener("click", () => c.classList.toggle("on")));
document.addEventListener("keydown", e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); document.getElementById("q").focus(); }
});

renderFeed(); renderDetail();
