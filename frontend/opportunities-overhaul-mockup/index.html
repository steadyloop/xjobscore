<!doctype html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Opportunities Triage</title>
<style>
:root {
  --paper: #fffefa; --ground: #f4f3ee; --ink: #18211b; --muted: #626b64; --faint: #7c847e;
  --line: #dddfd6; --line-strong: #c7cbc0; --nav: #15251e;
  --green: #28704f; --green-soft: #e3f2e8; --amber: #985c13; --amber-soft: #fff0d8; --red: #9e3b32; --red-soft: #fae9e6;
  --sans: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --shadow: 0 8px 28px rgb(24 33 27 / 7%);
  color-scheme: light;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--ground); color: var(--ink); font: 14px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
button, input, select { color: inherit; font: inherit; }
button, select { cursor: pointer; }
a { color: inherit; text-decoration: none; }
svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.8; }
:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
kbd { display: inline-block; min-width: 17px; border: 1px solid var(--line); border-radius: 5px; background: var(--ground); padding: 1px 5px; color: var(--muted); font: 700 9px/14px var(--mono); text-align: center; }

.view { max-width: 1320px; padding: 34px 36px 80px 56px; }
.section-kicker { color: var(--muted); font: 750 9px/1.3 var(--mono); letter-spacing: .1em; text-transform: uppercase; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; }
.page-head .section-kicker { margin: 0 0 6px; color: var(--green); font-size: 10px; }
.page-head h1 { margin: 0; font-size: 32px; line-height: 1.1; letter-spacing: -.045em; }
.session { text-align: right; color: var(--muted); font-size: 11px; }
.session b { color: var(--ink); font-weight: 650; }
.session .bar { width: 180px; height: 5px; margin: 6px 0 0 auto; border-radius: 3px; background: var(--line); overflow: hidden; display: flex; }
.session .bar i { height: 100%; display: block; }
.session .bar .ap { background: var(--green); } .session .bar .sk { background: var(--line-strong); }

.controls { border-bottom: 1px solid var(--line); margin-top: 30px; }
.filterbar { display: flex; align-items: center; gap: 23px; }
.filter { position: relative; display: inline-flex; align-items: baseline; gap: 6px; border: 0; background: transparent; padding: 0 1px 12px; color: var(--muted); font-size: 14px; font-weight: 720; }
.filter:hover { color: var(--ink); }
.filter.active { color: var(--ink); }
.filter.active::after { position: absolute; right: 0; bottom: -1px; left: 0; height: 2px; border-radius: 3px 3px 0 0; background: var(--ink); content: ""; }
.filter-count { color: var(--faint); font: 700 10px/1 var(--mono); }
.filter.active .filter-count { color: var(--green); }
.degree-filterbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 11px 0 13px; }
.degree-filter { display: inline-flex; align-items: baseline; gap: 5px; border: 1px solid var(--line-strong); border-radius: 999px; background: var(--paper); padding: 4px 8px; color: var(--muted); font-size: 11px; font-weight: 700; }
.degree-filter b { color: var(--faint); font: 700 9px var(--mono); }
.degree-filter:hover { border-color: var(--ink); color: var(--ink); }
.degree-filter.active { border-color: var(--green); background: var(--green-soft); color: var(--green); }
.degree-filter.active b { color: var(--green); }

.search-surface { display: flex; align-items: center; gap: 12px; margin-top: 12px; }
.search { height: 38px; flex: 1; display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 9px; background: var(--paper); padding: 0 10px; color: var(--faint); }
.search:focus-within { border-color: var(--green); box-shadow: 0 0 0 2px rgb(31 112 75 / 12%); }
.search svg { width: 16px; height: 16px; stroke-width: 2; }
.search input { width: 100%; height: 37px; border: 0; outline: 0; background: transparent; font-size: 14px; color: var(--ink); }
.sort { width: 140px; height: 38px; border: 1px solid var(--line); border-radius: 9px; background: var(--paper); padding: 0 3px 0 9px; color: var(--muted); font-size: 12px; font-weight: 650; }
.toggle { height: 38px; display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 9px; background: var(--paper); padding: 0 11px; color: var(--muted); font-size: 12px; font-weight: 650; }
.toggle i { position: relative; width: 26px; height: 14px; border-radius: 7px; background: var(--line-strong); transition: background .15s; }
.toggle i::after { content: ""; position: absolute; top: 2px; left: 2px; width: 10px; height: 10px; border-radius: 50%; background: white; transition: left .15s; }
.toggle.on { color: var(--ink); } .toggle.on i { background: var(--green); } .toggle.on i::after { left: 14px; }

.grid { display: grid; grid-template-columns: minmax(430px, 1fr) minmax(360px, 460px); gap: 12px 13px; margin-top: 12px; align-items: start; }
@media (max-width: 850px) { .grid { grid-template-columns: 1fr; } .detail { position: static !important; } .view { padding: 27px 18px 80px; } }

.list { display: grid; align-content: start; gap: 8px; }
.recency-bucket { display: flex; align-items: baseline; gap: 8px; margin: 9px 2px 1px; color: var(--faint); font: 700 10px/1.2 var(--mono); letter-spacing: .08em; text-transform: uppercase; }
.recency-bucket:first-child { margin-top: 1px; }
.recency-bucket span { color: var(--faint); font-weight: 500; letter-spacing: 0; text-transform: none; }

/* Company card: the original card chrome, holding one header and N role rows. */
.company { border: 1px solid var(--line); border-radius: 13px; background: var(--paper); box-shadow: 0 1px 2px rgb(24 33 27 / 3%); overflow: hidden; }
.company-head { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 11px 14px; }
.job-logo { width: 40px; height: 40px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 10px; background: #f8f8f4; font: 800 11px var(--mono); color: white; }
.job-company { color: var(--ink); font-size: 13px; font-weight: 760; letter-spacing: -.01em; display: flex; align-items: baseline; gap: 8px; }
.job-company .count { color: var(--faint); font: 700 10px var(--mono); }
.company-meta { margin-top: 2px; color: var(--muted); font-size: 10px; display: flex; gap: 6px; }
.company-meta > * + *::before { margin-right: 6px; color: var(--line-strong); content: "·"; }
.ats { display: inline-flex; align-items: center; gap: 5px; color: var(--muted); font: 600 10px var(--mono); }
.ats i { width: 7px; height: 7px; border-radius: 2px; background: var(--line-strong); }
.ats[data-ats="Greenhouse"] i { background: #3ab77c; } .ats[data-ats="Lever"] i { background: #6b5cd6; } .ats[data-ats="Ashby"] i { background: #e3714f; } .ats[data-ats="Workday"] i { background: #1c73c5; }

.role { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; align-items: center; gap: 10px; border-top: 1px solid #efeee9; padding: 9px 14px 9px 25px; cursor: pointer; transition: background-color .16s ease; }
.role:hover { background: #f8f8f4; }
.role.selected { background: #f4faf6; box-shadow: inset 3px 0 0 var(--green); }
.role h3 { margin: 0; font-size: 14px; font-weight: 600; line-height: 1.35; letter-spacing: -.015em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.role.blocked h3 { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line-strong); }
.role.applied h3, .role.skipped h3 { color: var(--muted); font-weight: 500; }
.role.skipped { opacity: .55; }
.state { width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid var(--line-strong); display: grid; place-items: center; color: transparent; font: 800 9px var(--mono); }
.role.applied .state { border-color: var(--green); background: var(--green); color: white; }
.role.saved .state { border-color: var(--amber); color: var(--amber); }
.role.skipped .state { color: var(--faint); }
.role.blocked .state { border-style: dashed; border-color: var(--red); color: var(--red); }
.tags { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 5px; }
.tag { display: inline-flex; align-items: center; gap: 4px; border-radius: 5px; padding: 3px 7px; font: 600 10px/1.25 var(--mono); white-space: nowrap; background: #edeee8; color: var(--muted); }
.tag.ok { background: var(--green-soft); color: var(--green); }
.tag.warn { background: var(--amber-soft); color: var(--amber); }
.tag.bad { background: var(--red-soft); color: var(--red); }
.tag.q { background: transparent; box-shadow: inset 0 0 0 1px var(--line); color: var(--faint); font-weight: 500; }
.tag.cue { background: transparent; color: var(--green); font: 700 10px var(--sans); padding-left: 0; }
.tag.cue svg { width: 11px; height: 11px; stroke-width: 2; }
.side { display: flex; align-items: center; gap: 10px; color: var(--faint); font: 700 10px var(--mono); }
.fit { display: inline-flex; gap: 2px; }
.fit i { width: 5px; height: 11px; border-radius: 1.5px; background: var(--line); }
.fit i.on { background: var(--green); }
.fold { margin: 4px 2px 0; color: var(--faint); font-size: 10px; display: flex; gap: 6px; }
.fold button { border: 0; border-bottom: 1px solid currentColor; background: none; padding: 0; color: var(--green); font: inherit; font-weight: 700; }

.detail { position: sticky; top: 18px; max-height: calc(100vh - 36px); overflow-y: auto; margin-top: 4px; border: 1px solid var(--line); border-radius: 15px; background: var(--paper); padding: 18px; box-shadow: 0 4px 16px rgb(24 33 27 / 5%); }
.detail-headline { display: flex; align-items: baseline; gap: 6px; font-size: 12px; line-height: 1.5; }
.detail-company { color: var(--ink); font-weight: 760; letter-spacing: -.01em; }
.detail-sep { color: var(--line-strong); }
.detail-place { color: var(--muted); font-size: 11px; display: inline-flex; align-items: center; gap: 5px; }
.detail-place svg { width: 13px; height: 13px; stroke-width: 2; }
.detail h2 { margin: 3px 0 0; font-size: 19px; line-height: 1.2; letter-spacing: -.028em; }
.detail-posted { display: flex; align-items: baseline; gap: 6px; margin-top: 8px; font-size: 11px; }
.posted-when { color: var(--ink); font-weight: 650; }
.posted-checked { color: var(--faint); }
.signals { display: grid; grid-template-columns: repeat(4, 1fr); margin-top: 14px; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
.signal { padding: 8px 10px; border-right: 1px solid var(--line); min-width: 0; }
.signal:nth-child(4n) { border-right: 0; }
.signal:nth-child(n+5) { border-top: 1px solid var(--line); }
.signal small { display: block; color: var(--faint); font: 750 8px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; margin-bottom: 4px; }
.signal span { display: block; font-size: 11.5px; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.signal.ok span { color: var(--green); } .signal.bad span { color: var(--red); } .signal.warn span { color: var(--amber); } .signal.q span { color: var(--faint); font-weight: 500; }
.detail-actions { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; margin: 14px 0 4px; font-size: 11px; }
.button { min-height: 36px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--paper); padding: 7px 11px; font-size: 11px; font-weight: 650; white-space: nowrap; }
.button:hover { border-color: #8f968e; }
.button.primary { border-color: var(--ink); background: var(--ink); color: white; }
.button.primary kbd { border-color: #3e4a42; background: #2a352e; color: #cfd6d0; }
.button.primary.blocked { border-color: var(--red-soft); background: var(--red-soft); color: var(--red); }
.button.primary.blocked kbd { border-color: #e8c9c4; background: white; color: var(--red); }
.button.primary.done { border-color: var(--green-soft); background: var(--green-soft); color: var(--green); }
.button svg { width: 13px; height: 13px; stroke-width: 2; }
.detail section { padding: 15px 0 0; margin-top: 15px; border-top: 1px solid var(--line); }
.section-kicker.row { display: flex; justify-content: space-between; }
.section-kicker.row span { letter-spacing: 0; text-transform: none; font-weight: 500; }
.req { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 6px; }
.req li { display: grid; grid-template-columns: 15px 1fr; gap: 8px; align-items: start; color: var(--muted); font-size: 11px; line-height: 1.5; }
.req li i { width: 15px; height: 15px; margin-top: 1px; border-radius: 4px; display: grid; place-items: center; font: 800 9px var(--mono); }
.req li.ok i { background: var(--green-soft); color: var(--green); } .req li.no i { background: var(--red-soft); color: var(--red); } .req li.hm i { background: var(--amber-soft); color: var(--amber); }
.req li.no { color: var(--ink); font-weight: 600; }
.skill-list { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 9px; }
.skill { display: inline-flex; border-radius: 5px; padding: 3px 7px; font: 600 10px/1.25 var(--mono); background: #edeee8; color: var(--muted); }
.skill.have { background: linear-gradient(180deg, #e3f2e8 0%, #d8eadf 100%); color: #1f6848; font-weight: 700; }
.role-summary { max-width: 55ch; margin: 8px 0 0; color: var(--muted); font-size: 11px; line-height: 1.7; }
.role-summary mark { background: var(--red-soft); color: var(--red); border-radius: 2px; padding: 0 2px; }

.keys { position: fixed; left: 0; right: 0; bottom: 0; border-top: 1px solid var(--line); background: rgb(244 243 238 / 92%); backdrop-filter: blur(8px); }
.keys .in { max-width: 1320px; padding: 8px 36px 8px 56px; display: flex; gap: 16px; flex-wrap: wrap; align-items: center; color: var(--muted); font-size: 11px; }
.keys .in span { display: inline-flex; gap: 4px; align-items: center; }
.keys .rate { margin-left: auto; color: var(--faint); font: 700 10px var(--mono); }
.flash { position: fixed; right: 20px; bottom: 48px; z-index: 20; border-radius: 9px; background: var(--ink); padding: 10px 13px; color: white; font-size: 12px; box-shadow: 0 8px 30px #0002; opacity: 0; transform: translateY(8px); transition: .2s; pointer-events: none; }
.flash.show { opacity: 1; transform: none; }
.flash b { color: #d9f36a; font-weight: 800; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>

    summary:"Build the pipelines and warehouse models that finance and risk teams run on.",
    reqs:[["ok","Python and SQL"],["ok","Airflow or dbt"],["ok","Warehouse modeling"]] },
  { id:10, co:"Verkada", title:"Embedded Software Intern", loc:"San Mateo, CA", wp:"On-site", term:"Summer 2027", degree:"BS", sponsor:"no", pay:"$48/hr", deadline:null, ats:"Lever", day:"yesterday", checked:"2h", skills:["C","C++","Linux","Embedded"],
    summary:"Firmware for cameras and access controllers. <mark>Sponsorship is not available for this role.</mark>",
    reqs:[["no","No sponsorship offered"],["hm","C/C++ on embedded Linux"]] },
];
const RANK = { BS:1, MS:2, PhD:3 };
const state = { sel: 2, hideApplied: true, status: { 3:"applied", 4:"applied", 6:"saved" }, start: Date.now() - 41*60000, appliedToday: 12, skippedToday: 31 };
const TODAY = new Date("2026-09-09");

const blocked = j => RANK[j.degree] > RANK[ME.degree] || j.sponsor === "no";
const fit = j => j.skills.filter(s => ME.skills.includes(s)).length;
const daysTo = d => Math.ceil((new Date(d) - TODAY) / 86400000);
const short = d => new Date(d).toLocaleDateString("en-US", { month:"short", day:"numeric", timeZone:"UTC" });
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const cue = j => `<span class="tag cue"><svg><use href="#icon-globe"/></svg>${j.wp}</span>`;

function tags(j) {
  const out = [];
  if (RANK[j.degree] > RANK[ME.degree]) out.push(`<span class="tag bad">${j.degree} required</span>`);
  else if (j.degree === "MS") out.push(`<span class="tag">MS+</span>`);
  out.push(j.sponsor === "yes" ? `<span class="tag ok">Sponsors</span>` : j.sponsor === "no" ? `<span class="tag bad">No sponsorship</span>` : `<span class="tag q">Sponsorship ?</span>`);
  if (j.deadline) { const d = daysTo(j.deadline); out.push(`<span class="tag ${d <= 7 ? "warn" : ""}">Apply by ${short(j.deadline)}${d <= 7 ? ` · ${d}d` : ""}</span>`); }
  if (j.pay) out.push(`<span class="tag">${j.pay}</span>`);
  out.push(cue(j));
  return out.join("");
}
const fitBar = j => `<span class="fit" title="${fit(j)} of ${j.skills.length} listed skills on your resume">${j.skills.map(s => `<i class="${ME.skills.includes(s) ? "on" : ""}"></i>`).join("")}</span>`;

function renderFeed() {
  let html = "", hidden = 0;
  for (const [key, label] of [["today","Opened today"],["yesterday","Opened yesterday"]]) {
    const list = JOBS.filter(j => j.day === key);
    const groups = [];
    for (const j of list) { const g = groups.find(g => g.co === j.co); g ? g.jobs.push(j) : groups.push({ co: j.co, jobs: [j] }); }
    html += `<div class="recency-bucket">${label} <span>· ${list.length} roles, ${groups.length} companies</span></div>`;
    for (const g of groups) {
      const [bg, ini] = LOGOS[g.co];
      const vis = g.jobs.filter(j => !(state.hideApplied && state.status[j.id] === "applied"));
      hidden += g.jobs.length - vis.length;
      if (!vis.length) continue;
      const f = g.jobs[0];
      html += `<article class="company"><div class="company-head"><span class="job-logo" style="background:${bg};border-color:${bg}">${ini}</span><div><div class="job-company">${esc(g.co)}${g.jobs.length > 1 ? `<span class="count">${g.jobs.length} roles</span>` : ""}</div><div class="company-meta"><span>${esc(f.loc)}</span><span>checked ${f.checked} ago</span></div></div><span class="ats" data-ats="${f.ats}"><i></i>${f.ats}</span></div>`;
      html += vis.map(j => {
        const st = state.status[j.id] || "", b = blocked(j);
        const mark = st === "applied" ? "✓" : st === "saved" ? "★" : st === "skipped" ? "–" : b ? "✕" : "";
        return `<div class="role ${state.sel === j.id ? "selected" : ""} ${st} ${b ? "blocked" : ""}" data-id="${j.id}" tabindex="0"><span class="state">${mark}</span><div><h3>${esc(j.title)}</h3><div class="tags">${tags(j)}</div></div><div class="side">${fitBar(j)}<span>${j.term.replace("Summer 20", "Su ’")}</span></div></div>`;
      }).join("");
      html += `</article>`;
    }
  }
  if (hidden) html += `<div class="fold">${hidden} applied and hidden <button id="showApplied">show</button></div>`;
  document.getElementById("feed").innerHTML = html;
}

function renderDetail() {
  const j = JOBS.find(j => j.id === state.sel); if (!j) return;
  const st = state.status[j.id] || "", b = blocked(j);
  const why = RANK[j.degree] > RANK[ME.degree] ? `${j.degree} required` : j.sponsor === "no" ? "no sponsorship" : "";
  const sig = (label, val, cls = "") => `<div class="signal ${cls}"><small>${label}</small><span>${val}</span></div>`;
  const n = fit(j);
  const primary = st === "applied" ? `<button class="button primary done" data-act="apply">Applied · undo</button>`
    : b ? `<button class="button primary blocked" data-act="apply">Apply anyway · ${why}<kbd>A</kbd></button>`
    : `<button class="button primary" data-act="apply">Apply on ${j.ats}<svg><use href="#icon-ext"/></svg><kbd>A</kbd></button>`;
  document.getElementById("detail").innerHTML = `
    <div class="detail-headline"><span class="detail-company">${esc(j.co)}</span><span class="detail-sep">·</span><span class="detail-place"><svg><use href="#icon-pin"/></svg>${esc(j.loc)}</span></div>
    <h2>${esc(j.title)}</h2>
    <div class="detail-posted"><span class="posted-when">Opened ${j.day}</span><span class="detail-sep">·</span><span class="posted-checked">checked ${j.checked} ago</span><span class="detail-sep">·</span><span class="ats" data-ats="${j.ats}"><i></i>${j.ats}</span></div>
    <div class="signals">
      ${sig("Degree", j.degree === "PhD" ? "PhD required" : j.degree + " or above", RANK[j.degree] > RANK[ME.degree] ? "bad" : "ok")}
      ${sig("Sponsorship", j.sponsor === "yes" ? "Offered" : j.sponsor === "no" ? "Not offered" : "Not stated", j.sponsor === "yes" ? "ok" : j.sponsor === "no" ? "bad" : "q")}
      ${sig("Deadline", j.deadline ? `${short(j.deadline)} · ${daysTo(j.deadline)}d` : "Rolling", j.deadline && daysTo(j.deadline) <= 7 ? "warn" : "")}
      ${sig("Pay", j.pay || "Not stated", j.pay ? "" : "q")}
      ${sig("Term", j.term.replace("Summer 20", "Summer ’"))}
      ${sig("Workplace", j.wp)}
      ${sig("Fit", `${n} of ${j.skills.length} skills`, n >= j.skills.length - 1 ? "ok" : n >= 2 ? "" : "warn")}
      ${sig("Status", st ? st[0].toUpperCase() + st.slice(1) : b ? "Blocked" : "Untouched", st === "applied" ? "ok" : b ? "bad" : st === "saved" ? "warn" : "q")}
    </div>
    <div class="detail-actions">${primary}<button class="button" data-act="skip">Skip<kbd>X</kbd></button><button class="button" data-act="save">${st === "saved" ? "Saved" : "Save"}<kbd>S</kbd></button></div>
    <section><div class="section-kicker row">Requirements <span>against your resume</span></div><ul class="req">${j.reqs.map(([c, t]) => `<li class="${c}"><i>${c === "ok" ? "✓" : c === "no" ? "✕" : "?"}</i>${esc(t)}</li>`).join("")}</ul></section>
    <section><div class="section-kicker">Skills named</div><div class="skill-list">${j.skills.map(s => `<span class="skill ${ME.skills.includes(s) ? "have" : ""}">${esc(s)}</span>`).join("")}</div></section>
    <section><div class="section-kicker">Role summary</div><p class="role-summary">${j.summary}</p></section>`;
}

function renderSession() {
  const left = 41, total = state.appliedToday + state.skippedToday + left;
  document.getElementById("session").innerHTML = `<b>${state.appliedToday} applied</b> · ${state.skippedToday} skipped · ${left} left today<div class="bar"><i class="ap" style="width:${state.appliedToday/total*100}%"></i><i class="sk" style="width:${state.skippedToday/total*100}%"></i></div>`;
  const mins = Math.max(1, Math.round((Date.now() - state.start) / 60000));
  document.getElementById("rate").textContent = `${(state.appliedToday / mins * 60).toFixed(0)} applies/hr · ${mins}m session`;
}
function render() { renderFeed(); renderDetail(); renderSession(); }

let flashTimer;
function flash(msg) { const f = document.getElementById("flash"); f.innerHTML = msg; f.classList.add("show"); clearTimeout(flashTimer); flashTimer = setTimeout(() => f.classList.remove("show"), 2200); }
const ids = () => [...document.querySelectorAll(".role")].map(r => +r.dataset.id);
function move(d) { const l = ids(), i = l.indexOf(state.sel), n = l[Math.min(l.length - 1, Math.max(0, (i < 0 ? 0 : i) + d))]; if (n != null) { state.sel = n; render(); document.querySelector(`.role[data-id="${n}"]`)?.scrollIntoView({ block: "nearest" }); } }
function advance() { const l = ids(), i = l.indexOf(state.sel); return l[i + 1] ?? l[i - 1] ?? state.sel; }
function setHide(v) { state.hideApplied = v; document.getElementById("hideApplied").classList.toggle("on", v); renderFeed(); }
function act(kind) {
  const j = JOBS.find(j => j.id === state.sel); if (!j) return;
  if (kind === "apply") {
    if (state.status[j.id] === "applied") { delete state.status[j.id]; state.appliedToday--; flash("Removed from Applications"); return render(); }
    state.status[j.id] = "applied"; state.appliedToday++;
    flash(`Opening ${j.ats} · <b>added to Applications</b>`);
    const next = advance(); if (state.hideApplied) state.sel = next; render();
  }
  if (kind === "skip") { state.status[j.id] = "skipped"; state.skippedToday++; flash(`Skipped ${esc(j.title)}`); state.sel = advance(); render(); }
  if (kind === "save") { state.status[j.id] = state.status[j.id] === "saved" ? "" : "saved"; flash(state.status[j.id] ? "Saved for later" : "Unsaved"); render(); }
  if (kind === "open") flash(`Opening ${j.ats} without tracking`);
}
document.addEventListener("click", e => {
  const row = e.target.closest(".role"); if (row) { state.sel = +row.dataset.id; return render(); }
  const b = e.target.closest("[data-act]"); if (b) return act(b.dataset.act);
  if (e.target.closest("#hideApplied")) return setHide(!state.hideApplied);
  if (e.target.id === "showApplied") return setHide(false);
  const chip = e.target.closest(".degree-filter"); if (chip) chip.classList.toggle("active");
  const tab = e.target.closest(".filter"); if (tab) { document.querySelectorAll(".filter").forEach(t => t.classList.remove("active")); tab.classList.add("active"); }
});
document.addEventListener("keydown", e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); return document.querySelector(".search input").focus(); }
  if (/input|select|textarea/i.test(document.activeElement.tagName)) { if (e.key === "Escape") document.activeElement.blur(); return; }
  const k = e.key.toLowerCase();
  if (k === "j" || e.key === "ArrowDown") { e.preventDefault(); move(1); }
  else if (k === "k" || e.key === "ArrowUp") { e.preventDefault(); move(-1); }
  else if (k === "a") act("apply"); else if (k === "x") act("skip"); else if (k === "s") act("save"); else if (k === "o") act("open");
  else if (k === "h") setHide(!state.hideApplied);
});
render();
setInterval(renderSession, 30000);
</script>
</body>
</html>
