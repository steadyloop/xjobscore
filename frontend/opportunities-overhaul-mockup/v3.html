<title>Opportunities Feed v3</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<style>
/* Third pass. Spacing ratio fixed, OneShot's own pill scheme restored, and the
   Apply button removed so every application is logged by construction. Tokens are
   copied from frontend/opportunities/styles.css. Mock data. */
:root {
  --paper: #fffefa;
  --ground: #f4f3ee;
  --ink: #18211b;
  --muted: #626b64;
  --faint: #7c847e;
  --line: #dddfd6;
  --line-strong: #c7cbc0;
  --edge: #eeede6;
  --nav: #15251e;
  --nav-raised: #22372d;
  --lime: #d9f36a;
  --green: #28704f;
  --green-soft: #e3f2e8;
  --green-deep: #1c5238;
  --amber: #985c13;
  --amber-soft: #fdf0dc;
  /* OneShot's existing two-tier pill system, lifted verbatim. Green is a concrete,
     matchable skill; grey is soft domain context. */
  --skill-bg: linear-gradient(180deg, #e3f2e8 0%, #d8eadf 100%);
  --skill-ink: #1f6848;
  --expertise-bg: #f1f3ef;
  --expertise-ink: #667168;
  --sans: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme: light;
}

* { box-sizing: border-box; }
html { background: var(--ground); }
body { margin: 0; background: var(--ground); color: var(--ink); font: 13px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
button, input, select { color: inherit; font: inherit; }
button, select { cursor: pointer; }
a { color: inherit; text-decoration: none; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }

.shell { min-height: 100vh; display: grid; grid-template-columns: 208px minmax(0, 1fr); }
.sidebar { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 2px; background: var(--nav); padding: 20px 11px; color: #eff4ef; }
.brand { display: flex; align-items: center; gap: 8px; padding: 0 9px 16px; font-size: 14px; font-weight: 780; letter-spacing: -.02em; }
.brand span { display: grid; place-items: center; width: 21px; height: 21px; border-radius: 6px; background: var(--lime); color: var(--nav); font: 800 10px var(--mono); }
.side-label { margin: 14px 10px 4px; color: rgb(255 255 255 / 38%); font: 9px var(--mono); letter-spacing: .12em; text-transform: uppercase; }
.side-nav-link { display: flex; align-items: center; gap: 9px; border-radius: 7px; padding: 7px 10px; color: rgb(255 255 255 / 66%); font-size: 12.5px; font-weight: 550; }
.side-nav-link:hover { background: var(--nav-raised); color: #fff; }
.side-nav-link.active { background: var(--nav-raised); color: #fff; font-weight: 650; }
.side-nav-link.active svg { color: var(--lime); }
.side-nav-link svg { width: 16px; height: 16px; flex: 0 0 16px; }
.side-nav-link b { margin-left: auto; border-radius: 20px; background: rgb(255 255 255 / 10%); padding: 1px 6px; font: 400 9.5px var(--mono); }

.view { width: 100%; max-width: 1330px; padding: 32px 34px 70px 46px; }
.kicker { color: var(--green); font: 750 9.5px/1.3 var(--mono); letter-spacing: .13em; text-transform: uppercase; }
h1 { margin-top: 5px; font-size: 30px; line-height: 1.05; letter-spacing: -.045em; }

.controls { border-bottom: 1px solid var(--line); margin-top: 22px; }
.tabs { display: flex; align-items: center; gap: 22px; flex-wrap: wrap; }
.tab { position: relative; display: inline-flex; align-items: baseline; gap: 6px; border: 0; background: transparent; padding: 0 1px 11px; color: var(--muted); font-size: 13px; font-weight: 640; }
.tab:hover { color: var(--ink); }
.tab.on { color: var(--ink); font-weight: 720; }
.tab.on::after { position: absolute; right: 0; bottom: -1px; left: 0; height: 2px; border-radius: 3px 3px 0 0; background: var(--ink); content: ""; }
.tab-n { color: var(--faint); font: 700 10px/1 var(--mono); font-variant-numeric: tabular-nums; }
.tab.on .tab-n { color: var(--green); }

.facets { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; padding: 11px 0 12px; }
.chip { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--line-strong); border-radius: 999px; background: var(--paper); padding: 4px 10px; color: var(--muted); font-size: 11px; font-weight: 640; }
.chip:hover { border-color: var(--ink); color: var(--ink); }
.chip.on { border-color: var(--green); background: var(--green-soft); color: var(--green-deep); font-weight: 700; }
.chip.on::after { content: "×"; font: 700 12px/1 var(--mono); opacity: .5; }

.searchbar { display: flex; align-items: center; gap: 9px; margin-top: 16px; }
.search { height: 39px; flex: 1; min-width: 0; display: flex; align-items: center; gap: 9px; border: 1px solid var(--line); border-radius: 10px; background: var(--paper); padding: 0 11px; color: var(--faint); }
.search:focus-within { border-color: var(--green); box-shadow: 0 0 0 3px rgb(40 112 79 / 10%); }
.search svg { width: 16px; height: 16px; flex: 0 0 16px; stroke-width: 2; }
.search input { width: 100%; height: 37px; border: 0; outline: 0; background: transparent; color: var(--ink); font-size: 13.5px; }
.search kbd { flex: 0 0 auto; border: 1px solid var(--line); border-radius: 5px; background: var(--ground); padding: 2px 6px; font: 9.5px/1.4 var(--mono); white-space: nowrap; }
.sort { height: 39px; border: 1px solid var(--line); border-radius: 10px; background: var(--paper); padding: 0 8px; color: var(--muted); font-size: 12px; font-weight: 640; }

.grid { display: grid; grid-template-columns: minmax(430px, 1fr) minmax(360px, 448px); gap: 24px; align-items: start; margin-top: 18px; }

/* THE SPACING RATIO. Outer must beat inner or compact reads as cramped:
   inside a card 3-6px, card padding 13px, between cards 10px. */
.feed { min-width: 0; display: grid; align-content: start; gap: 10px; }

.daymark { position: sticky; top: 0; z-index: 3; display: flex; align-items: center; gap: 11px; margin: 18px 0 2px; padding: 7px 0 6px; background: linear-gradient(var(--ground) 72%, rgb(244 243 238 / 0%)); color: var(--faint); font: 700 9.5px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; }
.daymark:first-child { margin-top: 0; }
.daymark::after { flex: 1; height: 1px; background: var(--line); content: ""; }

.op { position: relative; display: grid; grid-template-columns: 38px minmax(0, 1fr) 34px; align-items: start; gap: 13px; border: 1px solid var(--line); border-radius: 12px; background: var(--paper); padding: 13px 14px 13px 15px; text-align: left; transition: border-color .16s ease, box-shadow .16s ease; }
.op::before { position: absolute; top: 12px; bottom: 12px; left: 0; width: 2px; border-radius: 0 3px 3px 0; background: transparent; content: ""; transition: background-color .16s ease; }
.op:hover { border-color: var(--line-strong); box-shadow: 0 3px 14px rgb(24 33 27 / 6%); }
.op.on { border-color: var(--line-strong); box-shadow: 0 3px 14px rgb(24 33 27 / 7%); }
.op.on::before { background: var(--green); }

/* Centred against the text block so the card's left edge is anchored top and bottom. */
.op-logo { width: 38px; height: 38px; align-self: center; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 9px; background: #f8f8f4; overflow: hidden; font: 800 11px var(--mono); }

/* Two type sizes on a card, not three: 14px for the role, 11px for everything else. */
.op-body { min-width: 0; display: grid; gap: 4px; }
.op-body h3 { overflow: hidden; font-size: 14px; font-weight: 640; line-height: 1.3; letter-spacing: -.017em; text-overflow: ellipsis; white-space: nowrap; }
.op-meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; color: var(--muted); font-size: 11px; line-height: 1.45; }
.op-co { color: var(--ink); font-weight: 700; letter-spacing: -.005em; }
.op-meta .sep { color: var(--line-strong); }
.op-meta .more { color: var(--faint); font: 650 11px var(--mono); }
.op-tags { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 2px; }

/* OneShot's pill scheme, unchanged: green is a matchable skill. */
.tag { border-radius: 5px; background: var(--skill-bg); padding: 1px 7px; color: var(--skill-ink); font: 650 11px/1.55 var(--mono); }

.wp { display: inline-flex; align-items: center; gap: 4px; font-weight: 640; }
.wp svg { width: 12px; height: 12px; flex: 0 0 12px; stroke-width: 2; }
.wp[data-wp="remote"] { color: var(--green); font-weight: 700; }
.wp[data-wp="hybrid"] { color: var(--muted); }
.wp[data-wp="onsite"] { color: var(--faint); }
.wp[data-wp="unknown"] { color: var(--faint); font-style: italic; font-weight: 500; }

.due { display: inline-flex; align-items: center; gap: 4px; border-radius: 5px; background: var(--amber-soft); padding: 0 6px; color: var(--amber); font: 700 11px/1.55 var(--mono); }
.due svg { width: 11px; height: 11px; flex: 0 0 11px; stroke-width: 2.2; }

.state-badge { border-radius: 5px; padding: 0 6px; font: 700 11px/1.55 var(--mono); }
.state-badge.saved { background: var(--expertise-bg); color: var(--expertise-ink); }
.state-badge.applied { background: var(--ink); color: #eff4ef; }

/* Recency is carried by weight, not hue — green now belongs to skills and Remote. */
.op-rail { position: relative; justify-self: end; padding-top: 2px; text-align: right; }
.op-age { color: var(--faint); font: 600 11.5px/1 var(--mono); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.op.fresh .op-age { color: var(--ink); font-weight: 780; }
.op-acts { position: absolute; top: -5px; right: -4px; display: flex; gap: 3px; padding: 3px; border-radius: 8px; background: var(--paper); opacity: 0; transition: opacity .14s ease; pointer-events: none; }
.op:hover .op-acts, .op:focus-within .op-acts { opacity: 1; pointer-events: auto; }
.op-acts button { display: grid; place-items: center; width: 24px; height: 24px; border: 1px solid var(--line); border-radius: 7px; background: var(--paper); color: var(--muted); }
.op-acts button:hover { border-color: var(--ink); color: var(--ink); }
.op-acts svg { width: 13px; height: 13px; }
.op.is-applied { background: #fbfaf5; }
.op.is-applied .op-body h3 { color: var(--muted); }

.pager { display: flex; align-items: center; justify-content: center; margin-top: 16px; }
.pager button { border: 1px solid var(--line-strong); border-radius: 9px; background: var(--paper); padding: 8px 16px; font-size: 12px; font-weight: 640; }
.pager button:hover { border-color: var(--ink); }

/* ---------- detail ---------- */
.detail { position: sticky; top: 14px; max-height: calc(100vh - 28px); overflow-y: auto; border: 1px solid var(--line); border-radius: 14px; background: var(--paper); box-shadow: 0 4px 18px rgb(24 33 27 / 5%); scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent; }
.d-head { display: grid; grid-template-columns: minmax(0, 1fr) 42px; gap: 14px; padding: 18px 18px 0; }
.d-co { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; color: var(--muted); font-size: 11.5px; }
.d-co b { color: var(--ink); font-weight: 720; }
.d-co .sep { color: var(--line-strong); }
.d-head h2 { margin-top: 5px; font-size: 19px; line-height: 1.2; letter-spacing: -.03em; }
.d-logo { width: 42px; height: 42px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 10px; background: #f8f8f4; overflow: hidden; font: 800 12px var(--mono); }
.d-locs { margin: 7px 18px 0; color: var(--muted); font-size: 11.5px; line-height: 1.55; }

.d-live { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; margin: 9px 18px 0; color: var(--muted); font: 10.5px/1.6 var(--mono); }
.d-live b { color: var(--ink); font-weight: 700; }
.d-live .ok { display: inline-flex; align-items: center; gap: 4px; color: var(--green); font-weight: 700; }
.d-live .ok svg { width: 11px; height: 11px; stroke-width: 2.6; }
.d-live .sep { color: var(--line-strong); }

/* No Apply button. Shortlisting is the only primary action here, so every
   application starts as a tracked row instead of an untracked tab. */
.d-acts { display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 14px 18px 16px; }
.btn { min-height: 38px; display: inline-flex; align-items: center; justify-content: center; gap: 7px; border: 1px solid var(--line-strong); border-radius: 9px; background: var(--paper); padding: 8px 13px; font-size: 12px; font-weight: 660; }
.btn:hover { border-color: #8f968e; }
.btn svg { width: 15px; height: 15px; }
.btn.primary { border-color: var(--green); background: var(--green); color: #fff; font-weight: 700; }
.btn.primary:hover { border-color: var(--green-deep); background: var(--green-deep); }
.btn.primary.done { border-color: var(--line-strong); background: var(--expertise-bg); color: var(--expertise-ink); }
.btn.icon { padding: 8px 11px; }

.d-sec { border-top: 1px solid var(--edge); padding: 15px 18px; }
.d-eyebrow { color: var(--faint); font: 750 8.5px/1 var(--mono); letter-spacing: .13em; text-transform: uppercase; }

.pills { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 11px; }
.skill { border-radius: 5px; background: var(--skill-bg); padding: 2px 8px; color: var(--skill-ink); font: 650 11.5px/1.6 var(--mono); }
.expertise { border-radius: 5px; background: var(--expertise-bg); padding: 2px 8px; color: var(--expertise-ink); font: 550 11.5px/1.6 var(--sans); }

.summary { max-width: 58ch; margin-top: 10px; color: var(--muted); font-size: 12px; line-height: 1.72; }
.summary.none { color: var(--faint); font-style: italic; }

/* These links are now the only door to the posting itself, so they read as targets. */
.srcs { display: grid; gap: 6px; margin-top: 11px; }
.src { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); border-radius: 9px; background: var(--paper); padding: 9px 11px; transition: border-color .14s ease, background-color .14s ease; }
.src:hover { border-color: var(--line-strong); background: #f8f8f4; }
.src-n { flex: 1; min-width: 0; font-size: 12.5px; font-weight: 660; }
.src-n small { display: block; margin-top: 1px; color: var(--faint); font: 500 10px var(--mono); }
.src-tag { border-radius: 5px; background: var(--expertise-bg); padding: 2px 6px; color: var(--expertise-ink); font: 700 9px/1.5 var(--mono); letter-spacing: .06em; text-transform: uppercase; }
.src-tag.prime { background: var(--green-soft); color: var(--green-deep); }
.src svg { width: 14px; height: 14px; color: var(--faint); }
.src:hover svg { color: var(--ink); }

/* ---------- notes (mockup affordance, not part of the design) ---------- */
.notes-btn { position: fixed; right: 18px; bottom: 18px; z-index: 30; display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--nav); border-radius: 10px; background: var(--nav); padding: 10px 14px; color: #fff; font-size: 12px; font-weight: 660; box-shadow: 0 8px 26px rgb(24 33 27 / 22%); }
.notes-btn svg { width: 15px; height: 15px; color: var(--lime); }
.notes { position: fixed; top: 0; right: 0; z-index: 29; width: 352px; max-width: 92vw; height: 100vh; overflow-y: auto; border-left: 1px solid var(--line); background: var(--paper); padding: 22px 20px 92px; transform: translateX(100%); transition: transform .28s cubic-bezier(.4,0,.2,1); box-shadow: -12px 0 40px rgb(24 33 27 / 10%); }
body.notes-on .notes { transform: none; }
.notes h2 { font-size: 17px; letter-spacing: -.03em; }
.notes > p { margin: 7px 0 4px; color: var(--muted); font-size: 11.5px; line-height: 1.6; }
.note { display: grid; grid-template-columns: 20px 1fr; gap: 10px; border-top: 1px solid var(--edge); padding: 11px 4px; cursor: pointer; }
.note:hover { background: var(--ground); }
.note-n { display: grid; place-items: center; width: 20px; height: 20px; border-radius: 6px; background: var(--expertise-bg); color: var(--expertise-ink); font: 700 9.5px var(--mono); }
.note:hover .note-n { background: var(--green); color: #fff; }
.note b { display: block; font-size: 12px; font-weight: 680; }
.note span { display: block; margin-top: 3px; color: var(--muted); font-size: 11px; line-height: 1.55; }
.note-open { display: inline-block; margin-top: 5px; border-radius: 4px; background: var(--amber-soft); padding: 1px 5px; color: var(--amber); font: 700 9px var(--mono); letter-spacing: .05em; text-transform: uppercase; }
body[data-hi] [data-note] { transition: box-shadow .18s ease; }
body[data-hi="1"] [data-note="1"], body[data-hi="2"] [data-note="2"], body[data-hi="3"] [data-note="3"],
body[data-hi="4"] [data-note="4"], body[data-hi="5"] [data-note="5"], body[data-hi="6"] [data-note="6"],
body[data-hi="7"] [data-note="7"] { border-radius: 9px; box-shadow: 0 0 0 2px var(--green), 0 0 0 7px rgb(40 112 79 / 14%); }

@media (max-width: 1120px) { .grid { grid-template-columns: 1fr; } .detail { position: static; max-height: none; } }
@media (max-width: 820px) { .shell { grid-template-columns: 1fr; } .sidebar { display: none; } .view { padding: 22px 16px 80px; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: .01ms !important; } }
</style>

<div class="shell">
  <aside class="sidebar">
    <div class="brand"><span>1</span> ONESHOT</div>
    <p class="side-label">Discover</p>
    <a class="side-nav-link active" href="#"><svg><use href="#i-nav-a"/></svg> Opportunities <b>910</b></a>
    <p class="side-label">Track</p>
    <a class="side-nav-link" href="#"><svg><use href="#i-nav-b"/></svg> Applications <b>12</b></a>
    <a class="side-nav-link" href="#"><svg><use href="#i-nav-c"/></svg> Resume</a>
    <p class="side-label">System</p>
    <a class="side-nav-link" href="#"><svg><use href="#i-nav-d"/></svg> Feed Status</a>
  </aside>

  <main class="view">
    <div class="kicker">Discover</div>
    <h1>Opportunities</h1>

    <section class="controls">
      <div class="tabs" role="tablist" aria-label="Job types">
        <button class="tab on" role="tab" aria-selected="true">All <span class="tab-n">910</span></button>
        <button class="tab" role="tab" aria-selected="false">Internships <span class="tab-n">566</span></button>
        <button class="tab" role="tab" aria-selected="false">New Grad <span class="tab-n">250</span></button>
        <button class="tab" role="tab" aria-selected="false">Co-ops <span class="tab-n">64</span></button>
        <button class="tab" role="tab" aria-selected="false">Research <span class="tab-n">29</span></button>
        <button class="tab" role="tab" aria-selected="false">Student Jobs <span class="tab-n">1</span></button>
      </div>
      <div class="facets" role="group" aria-label="Focus area">
        <button class="chip on">Software</button>
        <button class="chip">Finance</button>
        <button class="chip">MedTech</button>
        <button class="chip">BioTech</button>
        <button class="chip">Regulatory</button>

const DAYS = { today:"Opened today", yest:"Opened yesterday", sep7:"Opened Sep 7", sep6:"Opened Sep 6" };
const WP = { remote:["i-remote","Remote"], hybrid:["i-hybrid","Hybrid"], onsite:["i-onsite","On-site"], unknown:["i-pin","Workplace not stated"] };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));

let selected = 1, query = "";

function card(j) {
  const [ico, label] = WP[j.wp];
  const state = j.state === "applied" ? '<span class="state-badge applied">Applied</span>'
    : j.state === "saved" ? '<span class="state-badge saved">Saved</span>' : "";
  const due = j.due ? `<span class="due"><svg><use href="#i-clock"/></svg>${esc(j.due)}</span>` : "";
  const tags = j.skills.slice(0, 3).map(s => `<span class="tag">${esc(s)}</span>`).join("");
  // One city plus a count. Five locations must not push company and workplace off the row.
  const extra = j.locs.length - 1;
  const loc = `${esc(j.locs[0])}${extra ? ` <span class="more">+${extra}</span>` : ""}`;
  return `<article class="op ${j.id === selected ? "on" : ""} ${j.day === "today" ? "fresh" : ""} ${j.state === "applied" ? "is-applied" : ""}" data-id="${j.id}" tabindex="0" role="button" aria-pressed="${j.id === selected}">
    <div class="op-logo" style="color:${j.tint}">${esc(j.logo)}</div>
    <div class="op-body" ${j.id === 3 ? 'data-note="1"' : ""}>
      <h3>${esc(j.title)}</h3>
      <div class="op-meta">
        <span class="op-co">${esc(j.co)}</span>
        <span class="sep">·</span><span ${j.id === 7 ? 'data-note="5"' : ""}>${loc}</span>
        <span class="sep">·</span><span class="wp" data-wp="${j.wp}"><svg><use href="#${ico}"/></svg>${esc(label)}</span>
        ${state}${due}
      </div>
      <div class="op-tags" ${j.id === 3 ? 'data-note="2"' : ""}>${tags}</div>
    </div>
    <div class="op-rail" ${j.id === 3 ? 'data-note="4"' : ""}>
      <span class="op-age">${esc(j.age)}</span>
      <span class="op-acts">
        <button title="Save" aria-label="Save"><svg><use href="#i-save"/></svg></button>
        <button title="Not interested" aria-label="Not interested"><svg><use href="#i-hide"/></svg></button>
      </span>
    </div>
  </article>`;
}

function renderFeed() {
  const q = query.trim().toLowerCase();
  const list = JOBS.filter(j => !q || (j.title + " " + j.co + " " + j.skills.join(" ")).toLowerCase().includes(q));
  let day = null, html = "";
  for (const j of list) {
    if (j.day !== day) { day = j.day; html += `<div class="daymark">${esc(DAYS[day])}</div>`; }
    html += card(j);
  }
  html += `<div class="pager"><button>Load more</button></div>`;
  document.getElementById("feed").innerHTML = list.length ? html : `<div class="daymark">No matches</div>`;
}

function renderDetail() {
  const j = JOBS.find(x => x.id === selected) || JOBS[0];
  const srcs = j.sources.map(([n, t, prime]) => `<a class="src" href="#">
      <span class="src-tag ${prime ? "prime" : ""}">${prime ? "Primary" : "Mirror"}</span>
      <span class="src-n">${esc(n)}<small>checked ${esc(t)} ago</small></span>
      <svg><use href="#i-ext"/></svg></a>`).join("");
  const skills = j.skills.map(s => `<span class="skill">${esc(s)}</span>`).join("");
  const expertise = (j.expertise || []).map(s => `<span class="expertise">${esc(s)}</span>`).join("");
  const done = j.state === "applied" || j.state === "saved";
  document.getElementById("detail").innerHTML = `
    <div class="d-head">
      <div>
        <div class="d-co"><b>${esc(j.co)}</b></div>
        <h2>${esc(j.title)}</h2>
      </div>
      <div class="d-logo" style="color:${j.tint}">${esc(j.logo)}</div>
    </div>
    <div class="d-locs" ${j.locs.length > 1 ? 'data-note="5"' : ""}>${j.locs.map(esc).join(" · ")}</div>
    <div class="d-live">
      <b>Posted ${esc(j.posted)}</b>
      <span class="sep">·</span>
      <span class="ok"><svg><use href="#i-check"/></svg>Link live ${esc(j.check)} ago</span>
    </div>
    <div class="d-acts" data-note="3">
      <button class="btn primary ${done ? "done" : ""}"><svg><use href="#i-save"/></svg>${done ? "On your shortlist" : "Save to apply"}</button>
      <button class="btn icon" title="Not interested" aria-label="Not interested"><svg><use href="#i-hide"/></svg></button>
    </div>
    <section class="d-sec">
      <div class="d-eyebrow">Skills</div>
      <div class="pills">${skills}</div>
    </section>
    ${expertise ? `<section class="d-sec"><div class="d-eyebrow">Expertise</div><div class="pills">${expertise}</div></section>` : ""}
    <section class="d-sec">
      <div class="d-eyebrow">Role summary</div>
      ${j.summary ? `<p class="summary">${esc(j.summary)}</p>` : `<p class="summary none">This board publishes no description text. Open the posting to read it in full.</p>`}
    </section>
    <section class="d-sec" data-note="6">
      <div class="d-eyebrow">Read the posting</div>
      <div class="srcs">${srcs}</div>
    </section>`;
}

const NOTES = [
  [1, "Outer spacing beats inner", "Inside a card the rows sit 4px apart; the card has 13px of padding and 10px between it and the next one. Last pass had 5px between cards and 5px inside them, which is why compact read as cramped. Same information, nine more pixels, and each card is an object again."],
  [2, "Your pill scheme, unchanged", "Green is a concrete matchable skill, grey is soft expertise — the two-tier system already in your CSS. I had made card tags grey, which threw the distinction away. Green now means an attribute you would filter on, which covers skills and Remote alike."],
  [3, "No Apply button", "Saving is the only primary action on this page, so an application cannot start without a tracked row behind it. Applying happens in Applications, against a list you built here. The label names the intent rather than the database write.", "your call"],
  [4, "Recency by weight, not colour", "Today's ages are ink and heavy, older ones grey and light. With green reassigned to skills, recency needed its own channel — weight is the one that does not compete."],
  [5, "Multi-location truncation", "Intel lists five cities and Cisco three. The card shows the first and a count so company and workplace stay on the row; the detail pane lists them all.", "fixes a bug"],
  [6, "The links carry the weight now", "With Apply gone these are the only door to the posting, so they are bordered rows with a hover state rather than faint text. Primary and mirror labels and per-board check times stay."],
  [7, "Two type sizes per card", "14px for the role, 11px for company, location, workplace, skills and age. Three sizes inside 40px of vertical space was part of the crowding."]
];

document.getElementById("noteList").innerHTML = NOTES.map(([n, t, d, tagText]) =>
  `<div class="note" data-n="${n}"><span class="note-n">${n}</span><div><b>${t}</b><span>${d}</span>${tagText ? `<i class="note-open">${tagText}</i>` : ""}</div></div>`).join("");

const feed = document.getElementById("feed");
feed.addEventListener("click", e => {
  if (e.target.closest(".op-acts")) { e.stopPropagation(); return; }
  const op = e.target.closest(".op");
  if (!op) return;
  selected = Number(op.dataset.id);
  renderFeed(); renderDetail();
});
feed.addEventListener("keydown", e => {
  const op = e.target.closest(".op");
  if (op && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); selected = Number(op.dataset.id); renderFeed(); renderDetail(); }
});
document.getElementById("q").addEventListener("input", e => { query = e.target.value; renderFeed(); });
document.getElementById("notesBtn").addEventListener("click", () => document.body.classList.toggle("notes-on"));
document.getElementById("noteList").addEventListener("mouseover", e => {
  const n = e.target.closest(".note"); if (n) document.body.dataset.hi = n.dataset.n;
});
document.getElementById("noteList").addEventListener("mouseleave", () => { delete document.body.dataset.hi; });
document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => {
  document.querySelectorAll(".tab").forEach(x => { x.classList.remove("on"); x.setAttribute("aria-selected", "false"); });
  t.classList.add("on"); t.setAttribute("aria-selected", "true");
}));
document.querySelectorAll(".chip").forEach(c => c.addEventListener("click", () => c.classList.toggle("on")));
document.addEventListener("keydown", e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); document.getElementById("q").focus(); }
});

renderFeed(); renderDetail();
</script>
