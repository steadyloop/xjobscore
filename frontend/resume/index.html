<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="The OneShot resume studio.">
  <title>Resume · OneShot</title>
  <link rel="stylesheet" href="/static/resume/styles.css?v=sample-in-page-20260816">
  <link rel="stylesheet" href="/static/navigation.css?v=stable-nav-20260817">
  <script defer src="/static/sample-data.js?v=us-recency-buckets-20260821"></script>
  <script defer src="/static/api-client.js?v=visitor-local-20260816"></script>
  <script defer src="/static/nav-count.js?v=visitor-local-20260816"></script>
  <script defer src="/static/resume/app.js?v=visitor-local-20260816"></script>
</head>
<body>
  <a class="skip-link" href="#workspace">Skip to resume studio</a>
  <svg class="icon-sprite" aria-hidden="true">
    <symbol id="icon-compass" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m15.4 8.6-2 4.8-4.8 2 2-4.8 4.8-2Z"/></symbol>
    <symbol id="icon-pipeline" viewBox="0 0 24 24"><path d="M5 4v16M5 7h5a3 3 0 0 1 3 3v4a3 3 0 0 0 3 3h3"/><path d="m16 14 3 3-3 3"/></symbol>
    <symbol id="icon-radar" viewBox="0 0 24 24"><circle cx="12" cy="12" r="2"/><path d="M12 3a9 9 0 0 1 9 9M12 7a5 5 0 0 1 5 5M5.6 5.6a9 9 0 1 0 12.8 12.8"/></symbol>
    <symbol id="icon-doc" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></symbol>
    <symbol id="icon-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="icon-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="icon-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9a2.1 2.1 0 0 0-3-3L5 17Z"/><path d="m13.5 6.5 3 3"/></symbol>
    <symbol id="icon-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></symbol>
    <symbol id="icon-check" viewBox="0 0 24 24"><path d="m5 13 4 4L19 7"/></symbol>
    <symbol id="icon-download" viewBox="0 0 24 24"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></symbol>
  </svg>

  <div class="shell">
    <aside class="sidebar" aria-label="Primary navigation">
      <a class="brand" href="/"><img class="brand-mark" src="/static/brand-mark.svg?v=20260813" alt="" width="32" height="32"><span class="brand-word">OneShot</span><span class="brand-sub">Application Pipeline</span></a>
      <nav class="side-nav">
        <a href="/"><svg class="nav-icon" aria-hidden="true"><use href="#icon-compass"/></svg>Opportunities <b data-opportunity-count>—</b></a>
        <a href="/application/"><svg class="nav-icon" aria-hidden="true"><use href="#icon-pipeline"/></svg>Applications</a>
        <a class="active" href="/resume/" aria-current="page"><svg class="nav-icon" aria-hidden="true"><use href="#icon-doc"/></svg>Resume</a>
        <p>System</p>
        <a href="/source-coverage/"><svg class="nav-icon" aria-hidden="true"><use href="#icon-radar"/></svg>Source coverage</a>
      </nav>
    </aside>

    <main id="workspace" class="workspace" tabindex="-1">
      <header class="workspace-header">
        <div><p class="eyebrow">Build</p><h1>Resume</h1></div>
        <div class="workspace-actions">
          <span id="typst-badge" class="typst-badge" hidden>Typst not installed — PDF export disabled</span>
          <button class="sample-toggle" type="button" data-action="sample-toggle" role="switch" aria-checked="false" aria-label="Turn on sample data">
            <span class="sample-toggle-copy">Sample data<small>Off</small></span>
            <span class="sample-switch" aria-hidden="true"><i></i></span>
          </button>
        </div>
      </header>

      <section class="control-surface" aria-label="Resume studio views">
        <div class="view-tabs" role="tablist" aria-label="Studio sections">
          <button id="tab-bank" role="tab" aria-selected="true" data-tab="bank">Content bank</button>
          <button id="tab-targets" role="tab" aria-selected="false" data-tab="targets">Targets</button>
          <button id="tab-builder" role="tab" aria-selected="false" data-tab="builder">Builder</button>
        </div>
      </section>

      <section id="view" class="studio-content" aria-live="polite">
        <div class="loading-state"><span></span><p>Loading resume workspace…</p></div>
      </section>
    </main>
  </div>

  <dialog id="entry-dialog" class="modal" aria-labelledby="entry-title">
    <form id="entry-form" method="dialog">
      <header class="dialog-header"><div><p class="eyebrow">Content bank</p><h2 id="entry-title">Add entry</h2></div>
        <button class="icon-button" type="button" data-action="close" aria-label="Close"><svg aria-hidden="true"><use href="#icon-close"/></svg></button></header>
      <div class="form-grid">
        <label>Kind<select name="kind"><option value="education">Education</option><option value="experience">Experience</option><option value="research">Research</option><option value="project">Project</option><option value="leadership">Leadership</option></select></label>
        <label>Organization / name<input name="org" required maxlength="300"></label>
        <label>Role / degree<input name="role" maxlength="300"></label>
        <label>Location<input name="location" maxlength="200"></label>
        <label>Start (e.g. May 2026)<input name="start_date" maxlength="40"></label>
        <label>End (or "Present")<input name="end_date" maxlength="40"></label>
        <label class="full">URL<input name="url" maxlength="2000" placeholder="https://github.com/…"></label>
        <label class="full">Detail (GPA line, tech stack, …)<input name="detail" maxlength="500"></label>
      </div>
      <footer class="dialog-actions"><button class="button" type="button" data-action="close">Cancel</button><button class="button primary" type="submit">Save entry</button></footer>
    </form>
  </dialog>

  <dialog id="bullet-dialog" class="modal" aria-labelledby="bullet-title">
    <form id="bullet-form" method="dialog">
      <header class="dialog-header"><div><p class="eyebrow">Content bank</p><h2 id="bullet-title">Add bullet</h2></div>
        <button class="icon-button" type="button" data-action="close" aria-label="Close"><svg aria-hidden="true"><use href="#icon-close"/></svg></button></header>
      <div class="form-grid">
        <label class="full">Bullet text (verb + what + how + number)<textarea name="text" rows="3" required maxlength="600"></textarea></label>
        <label>Audience<select name="audience"><option value="all">All</option><option value="mlsys">ML Systems</option><option value="swe">Systems SWE</option><option value="quant">Quant</option></select></label>
        <label>Tags (comma-separated)<input name="tags" maxlength="300" placeholder="python, optimization"></label>
        <label class="full">Defense notes — what you'd say to "tell me more"<textarea name="defense_notes" rows="3" maxlength="4000"></textarea></label>
      </div>
      <footer class="dialog-actions"><button class="button" type="button" data-action="close">Cancel</button><button class="button primary" type="submit">Save bullet</button></footer>
    </form>
  </dialog>

  <dialog id="job-dialog" class="modal" aria-labelledby="job-title">
    <form id="job-form" method="dialog">
      <header class="dialog-header"><div><p class="eyebrow">Targets</p><h2 id="job-title">Add target posting</h2></div>
        <button class="icon-button" type="button" data-action="close" aria-label="Close"><svg aria-hidden="true"><use href="#icon-close"/></svg></button></header>
      <div class="form-grid">
        <label>Company<input name="company" required maxlength="300"></label>
        <label>Role title<input name="title" required maxlength="500"></label>
        <label>Posting URL<input name="url" maxlength="2000"></label>
        <label>Date posted (YYYY-MM-DD)<input name="date_posted" maxlength="40" placeholder="2026-08-10"></label>
        <label class="full">Job description (paste full text)<textarea name="jd_text" rows="8" maxlength="100000"></textarea></label>
        <label class="full">Note (referral contact, recruiter, …)<textarea name="note" rows="2" maxlength="4000"></textarea></label>
      </div>
      <footer class="dialog-actions"><button class="button" type="button" data-action="close">Cancel</button><button class="button primary" type="submit">Save target</button></footer>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
