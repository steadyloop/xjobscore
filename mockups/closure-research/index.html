<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Closures · xJobscore</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <nav class="navigation" aria-label="Console">
    <a class="brand" href="http://127.0.0.1:8765/system">xJobscore</a>
    <div class="nav-links"><a href="http://127.0.0.1:8765/system">System</a><a href="http://127.0.0.1:8765/keyscan">Keyscan</a><a href="http://127.0.0.1:8765/tokens">Tokens</a><a href="http://127.0.0.1:8765/feeds">Feeds</a><a href="http://127.0.0.1:8765/companies">Companies</a><a href="#" aria-current="page">Closures</a></div>
  </nav>
  <main>
    <header class="page-heading"><h1>Closures</h1><div class="date-controls"><span id="date-range"></span><select id="period" aria-label="Date range"><option value="7">Last 7 days</option><option value="30">Last 30 days</option><option value="90">Last 90 days</option><option value="all">All time</option></select></div></header>
    <div class="filters">
      <label class="select-wrap"><span class="sr-only">Company</span><select id="company"><option value="">All companies</option></select></label>
      <label class="select-wrap"><span class="sr-only">Role</span><select id="role"><option value="">All roles</option></select></label>
      <div id="range-filter" hidden></div>
      <button id="reset" class="text-button" type="button" hidden>Reset</button>
      <label class="search-wrap"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5"/><path d="m13 13 4 4"/></svg><input id="search" type="search" placeholder="Search jobs or locations" aria-label="Search jobs or locations"></label>
    </div>

    <div class="research">
      <section class="timeline-panel" aria-labelledby="timeline-heading">
        <div class="section-heading"><h2 id="timeline-heading" title="First detected closure, not necessarily the time the employer closed the posting.">Closures over time</h2><div class="toggle" id="granularity" role="group" aria-label="Time grouping"><button type="button" data-value="day" aria-pressed="false">Daily</button><button type="button" data-value="hour" aria-pressed="true">Hourly</button></div></div>
        <div class="timeline" id="timeline"><svg id="chart" role="group" aria-label="Closures over time. Select a bar or drag across a time range to filter jobs."></svg><div class="tooltip" id="tooltip" role="status" hidden></div></div>
      </section>
      <section class="breakdown-panel" aria-label="Closure breakdown">
        <div class="section-heading"><div class="breakdown-tabs" role="group" aria-label="Breakdown"><button id="companies-tab" type="button" aria-pressed="true">Companies</button><button id="roles-tab" type="button" aria-pressed="false" title="Broad groups derived from job titles">Roles</button></div></div>
        <div id="ranking" class="ranking"></div>
      </section>
    </div>

    <section class="jobs" aria-labelledby="jobs-heading">
      <div class="section-heading jobs-heading"><div class="jobs-title"><h2 id="jobs-heading">Jobs</h2><span id="job-count"></span></div><button id="export" class="export-button" type="button"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2v10m-4-4 4 4 4-4M3 13v4h14v-4"/></svg>Export CSV</button></div>
      <div class="table-wrap"><table><colgroup><col class="company-col"><col class="role-col"><col class="location-col"><col class="posted-col"><col class="closed-col"></colgroup><thead><tr><th><button type="button" data-sort="company_name">Company</button></th><th><button type="button" data-sort="title">Role</button></th><th><button type="button" data-sort="location_text">Location</button></th><th><button type="button" data-sort="posted_at">Posted</button></th><th><button type="button" data-sort="closed_at" class="sorted">Closed <span>↓</span></button></th></tr></thead><tbody id="jobs"></tbody></table></div>
      <div id="empty" class="empty" hidden>No matching jobs</div>
      <footer class="table-footer"><span id="page-label"></span><div class="pager"><button id="previous" type="button" aria-label="Previous page">←</button><span id="page-number"></span><button id="next" type="button" aria-label="Next page">→</button></div></footer>
    </section>
  </main>
  <dialog id="job-detail"><div class="dialog-heading"><span id="detail-company"></span><button id="close-detail" type="button" aria-label="Close job details">×</button></div><h2 id="detail-title"></h2><dl id="detail-fields"></dl><a id="detail-link" target="_blank" rel="noopener noreferrer">Original posting ↗</a><p id="detail-description"></p></dialog>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
