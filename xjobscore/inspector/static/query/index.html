<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>xJobscore</title>
  <link rel="stylesheet" href="/static/shared/tokens.css">
  <link rel="stylesheet" href="/static/shared/base.css">
  <link rel="stylesheet" href="/static/shared/components.css">
  <script>
    (() => {
      const theme = localStorage.getItem("inspector-theme");
      if (theme) document.documentElement.dataset.theme = theme;
    })();
  </script>
</head>
<body>
  <header id="topnav"></header>
  <main class="page">
    <div class="page-header">
      <select id="snippet-select" title="Starter queries">
        <option value="">Snippets…</option>
      </select>
      <button class="btn primary" type="button" id="run-btn" title="Run (⌘/Ctrl + Enter)">Run</button>
      <div class="grow"></div>
      <span class="secondary" id="run-status"></span>
    </div>

    <div class="banner" id="degraded-banner" hidden>
      PostgreSQL is unreachable — the schema list is empty and queries cannot run.
    </div>
    <div class="banner error" id="error-banner" hidden>
      <span id="error-text"></span>
    </div>

    <div class="query-layout">
      <aside class="query-sidebar">
        <section class="card">
          <header><h1>Schema</h1></header>
          <div class="query-sidebar-body">
            <input type="search" id="schema-filter" placeholder="Filter tables…" autocomplete="off">
            <div class="query-schema-list" id="schema-list"></div>
          </div>
        </section>
        <section class="card">
          <header><h1>Recent</h1></header>
          <div class="query-sidebar-body">
            <div class="query-history-list" id="history-list"></div>
            <p class="muted query-history-empty" id="history-empty">No queries yet.</p>
          </div>
        </section>
      </aside>

      <div class="query-main">
        <section class="card">
          <textarea id="sql-editor" class="query-editor" spellcheck="false" autocomplete="off"
                    autocapitalize="off" placeholder="select …" aria-label="SQL query"></textarea>
        </section>

        <section class="card">
          <div class="table-wrap">
            <table class="data" id="results-table">
              <thead><tr id="results-head"></tr></thead>
              <tbody id="results-body"></tbody>
            </table>
          </div>
          <div class="empty-state" id="results-empty">Run a query to see results.</div>
          <div class="query-foot" id="results-foot" hidden></div>
          <div class="query-row-detail" id="row-detail" hidden>
            <div class="query-row-detail-head">
              <span class="secondary">Row detail</span>
              <button class="btn small" type="button" id="row-detail-close">Close</button>
            </div>
            <pre class="json-pane" id="row-detail-json"></pre>
          </div>
        </section>
      </div>
    </div>
  </main>

  <script type="module" src="/static/query/app.js"></script>
</body>
</html>
