<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scheduler · xJobscore</title>
  <link rel="stylesheet" href="/static/shared/tokens.css">
  <link rel="stylesheet" href="/static/shared/base.css">
  <link rel="stylesheet" href="/static/shared/components.css">
  <link rel="stylesheet" href="/static/scheduler/styles.css">
  <script>
    (() => {
      const theme = localStorage.getItem("inspector-theme");
      if (theme) document.documentElement.dataset.theme = theme;
    })();
  </script>
</head>
<body class="scheduler-page">
  <header id="topnav"></header>

  <main class="ops-shell" id="ops-shell">
    <header class="ops-header" aria-labelledby="page-title">
      <div class="ops-header-title">
        <h1 id="page-title">Scheduler</h1>
        <span class="ops-header-sub">polling control panel</span>
      </div>
      <div class="ops-header-right">
        <div class="ops-run-state" id="run-state" aria-live="polite"></div>
        <button class="btn small ops-run-toggle" type="button" id="run-toggle">Loading…</button>
        <span class="ops-clock" id="utc-clock" aria-hidden="true"></span>
      </div>
    </header>
    <div class="ops-summary-line" id="summary-line" aria-live="polite">Loading scheduler state…</div>

    <div class="ops-alert" id="system-alert" role="status" hidden></div>

    <div class="ops-provider-chips" id="provider-chips" role="group" aria-label="Filter by provider"></div>

    <div class="ops-filterbar">
      <label class="ops-search">
        <span class="sr-only">Filter feeds</span>
        <input type="search" id="search" placeholder="filter…" autocomplete="off">
        <kbd>/</kbd>
      </label>

      <div class="ops-view-pills" role="group" aria-label="Feed view">
        <button type="button" data-view="all" aria-pressed="true">all <span></span></button>
        <button type="button" data-view="issues" aria-pressed="false">issues <span></span></button>
        <button type="button" data-view="failing" aria-pressed="false">failing <span></span></button>
        <button type="button" data-view="paused" aria-pressed="false">paused <span></span></button>
      </div>

      <span class="ops-shown" id="row-count"></span>
      <button class="btn small" type="button" id="refresh">Refresh</button>
      <button class="btn small" type="button" id="fetch-shown">Fetch shown</button>
    </div>

    <div class="ops-layout" id="ops-layout">
      <div class="table-wrap ops-table-wrap">
        <table class="data ops-table" id="sched-table">
          <thead>
            <tr>
              <th data-sort="status"><button type="button">st</button></th>
              <th data-sort="name"><button type="button">source</button></th>
              <th data-sort="provider"><button type="button">provider</button></th>
              <th class="num" data-sort="interval"><button type="button">ivl</button></th>
              <th class="num" data-sort="due"><button type="button">next</button></th>
              <th class="num" data-sort="last_poll"><button type="button">last</button></th>
              <th class="num" data-sort="jobs"><button type="button">new·1d</button></th>
              <th class="num" data-sort="errors"><button type="button">err·7d</button></th>
              <th class="ops-actions-col"><span class="sr-only">Actions</span></th>
            </tr>
          </thead>
          <tbody id="sched-body"></tbody>
        </table>
        <div class="empty-state" id="sched-empty" hidden></div>
      </div>
      <div class="ops-rail">
        <section class="ops-livelog" aria-label="Live fetch log">
          <header class="ops-livelog-header">
            <span>live fetch log</span>
            <span class="ops-log-dot" id="live-log-dot"></span>
            <span class="ops-livelog-tail">tail -f</span>
          </header>
          <div class="ops-log-lines" id="live-log-lines" aria-live="off"></div>
        </section>
        <aside class="ops-detail-panel" id="detail-panel" aria-labelledby="panel-title" hidden></aside>
      </div>
    </div>
  </main>

  <dialog class="ops-dialog" id="bulk-dialog" aria-labelledby="bulk-title"></dialog>
  <div class="ops-toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script type="module" src="/static/scheduler/app.js"></script>
</body>
</html>
