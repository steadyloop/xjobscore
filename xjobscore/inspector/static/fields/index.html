<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>xJobscore</title>
  <link rel="stylesheet" href="/static/shared/tokens.css">
  <link rel="stylesheet" href="/static/shared/base.css">
  <link rel="stylesheet" href="/static/shared/components.css">
  <script>
    (() => {
      const theme = localStorage.getItem("inspector-theme");
      if (theme) document.documentElement.dataset.theme = theme;
    })();
  </script>
</head>
<body>
  <header id="topnav"></header>
  <main class="page">
    <div class="page-header">
      <select id="feed-select" title="Narrow to one feed instance" disabled>
        <option value="">All feeds</option>
      </select>
      <select id="sample-select" title="Payloads sampled for the survey"></select>
      <select id="depth-select" title="How deep to walk nested objects"></select>
      <input type="search" id="path-filter" placeholder="Filter paths…" autocomplete="off" disabled>
      <label class="fields-check">
        <input type="checkbox" id="unmapped-only"> Unmapped only
      </label>
      <div class="grow"></div>
      <span class="secondary" id="survey-status"></span>
    </div>

    <div class="banner" id="degraded-banner" hidden>
      PostgreSQL is unreachable — no adapter can be surveyed.
    </div>
    <div class="banner error" id="error-banner" hidden>
      <span id="error-text"></span>
    </div>

    <div class="fields-layout" id="fields-layout">
      <aside class="fields-sidebar">
        <section class="card">
          <header><h1>Adapters</h1></header>
          <div class="fields-sidebar-body">
            <input type="search" id="adapter-filter" placeholder="Filter adapters…" autocomplete="off">
            <div class="fields-adapter-list" id="adapter-list"></div>
          </div>
        </section>
      </aside>

      <section class="card fields-survey">
        <header>
          <h1 id="survey-title">Field survey</h1>
          <span class="grow"></span>
          <span class="badge" id="survey-badge" hidden></span>
        </header>
        <div class="fields-notice" id="survey-notice" hidden></div>
        <div class="table-wrap">
          <table class="data" id="survey-table" hidden>
            <thead>
              <tr>
                <th>Path</th>
                <th>Type</th>
                <th class="num" title="Share of sampled postings that carry this path">Coverage</th>
                <th class="num" title="Share of occurrences that hold a non-empty value">Fill</th>
                <th class="num">Distinct</th>
                <th>→ Canonical</th>
              </tr>
            </thead>
            <tbody id="survey-body"></tbody>
          </table>
        </div>
        <div class="empty-state" id="survey-empty">Pick an adapter to survey its payload fields.</div>
        <div class="query-foot" id="survey-foot" hidden></div>
      </section>

      <aside class="fields-detail" id="detail-pane" hidden>
        <section class="card">
          <header>
            <h1 id="detail-path" class="mono">—</h1>
            <span class="grow"></span>
            <button class="btn small" type="button" id="detail-close">Close</button>
          </header>
          <div class="fields-detail-body">
            <div class="stat-row" id="detail-stats"></div>
            <div id="detail-chain"></div>
            <div class="fields-values" id="detail-values"></div>
            <div class="empty-state" id="detail-empty" hidden></div>
          </div>
          <div class="fields-examples" id="detail-examples" hidden>
            <div class="query-row-detail-head">
              <span class="secondary" id="examples-title">Examples</span>
              <button class="btn small" type="button" id="examples-close">Close</button>
            </div>
            <pre class="json-pane" id="examples-json"></pre>
          </div>
        </section>
      </aside>
    </div>
  </main>

  <script type="module" src="/static/fields/app.js"></script>
</body>
</html>
