schema_version = 1
source = "pinpoint"

# The board never states its own employer -- `company_raw` maps to the bare
# key (json-api-configs.py:139). Hosting at workwithus.pinpointhq.com rather
# than a client-named subdomain reads as Pinpoint's own careers page, but
# that is an inference from the URL shape, not a fact the payload asserts.
[[feed]]
key = "workwithus"
company_id = "pinpoint"
company = "Pinpoint"
domain = "pinpointhq.com"
status = "live"
enabled = true
validated_at = "2026-08-06"
