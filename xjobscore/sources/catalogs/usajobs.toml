schema_version = 1
source = "usajobs"

# BLOCKED on a personal, free API key -- see doc/integration-plan.md section 4.
# Do NOT put a real Authorization-Key/User-Agent pair in this file: unlike
# Comeet's board token (catalogs/comeet.toml), which is a public per-board
# value safe to commit, a USAJOBS key is minted against one person's
# registered email and is a personal credential. Leave status = "planned"
# (excluded from catalog.feeds() and from raw_inspection's live sweep -- see
# its UNRUNNABLE dict) until a key exists. Then supply api_key/ua_email
# through the *runtime*, operator-owned Feed.config (the Postgres `feed` row
# for this feed), never through this tracked file. A local, uncommitted edit
# to this file for a one-off manual smoke test is acceptable; revert it
# before committing anything else.
#
# To get a key: register a free account at
# https://developer.usajobs.gov/apirequest/ -- the confirmation email carries
# the Authorization-Key, and the same registered email becomes the
# User-Agent header value.

[[feed]]
key = "usajobs"
company_id = "usajobs"
company = "USAJOBS"
domain = "usajobs.gov"
status = "planned"
enabled = true
validated_at = "2026-08-07"
