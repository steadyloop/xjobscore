schema_version = 1
source = "unstop"

# Platform-wide opportunity search, not a per-employer board (see
# json-api-configs.py:182-192): one feed covers every listing on Unstop, so
# `key` names the feed itself and each row states its own employer.
[[feed]]
key = "unstop"
company_id = "unstop"
company = "Unstop"
domain = "unstop.com"
status = "live"
enabled = true
validated_at = "2026-08-06"
