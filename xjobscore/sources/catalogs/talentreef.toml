schema_version = 1
source = "talentreef"

# Unauthenticated Elasticsearch proxy in front of the whole TalentReef estate
# (see json-api-configs.py:219-231): one feed, ~196k postings across every
# client, so there is no tenant in the key and each row states its own
# employer (clientName/brand).
[[feed]]
key = "talentreef"
company_id = "talentreef"
company = "TalentReef"
domain = "talentreef.com"
status = "live"
enabled = true
validated_at = "2026-08-06"
