source = "adp"

# The key is `cid/ccId`, ADP Workforce Now's two opaque career-center
# identifiers. `ccId` is technically optional (a bogus value returns 200
# with an empty array rather than an error) but every tenant found in the
# wild emits one, so it stays in the key for clarity.
#
# Nothing in the payload names the employer, so `company_raw` is supplied
# per feed. Each `cid` below is confirmed against the company's own site
# linking that exact GUID (not merely a title/location guess).

