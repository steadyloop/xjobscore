schema_version = 1
source = "ukg"

# The key is `host/companyCode/boardGuid`. The host is load-bearing: UKG shards
# tenants across recruiting, recruiting2, ... and a board answers on exactly one
# of them (ARU1000ARUP is 200 on recruiting2 and 404 on recruiting), so it cannot
# be defaulted.
#
# Nothing in the payload names the employer -- the key is two opaque ids and a
# host -- so `company_raw` has to come from here. Every board below was harvested
# end to end on 2026-08-06 (10, 149 and 328 postings, the last two across several
# `Skip` pages).

[[feed]]
key = "recruiting.ultipro.com/UNI1076UNFI/86df2700-c124-49b9-b096-7cacea55e9dd"
verified = true
