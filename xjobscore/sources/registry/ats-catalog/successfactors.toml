schema_version = 1
source = "successfactors"

# `key` is the career-site host, not a company slug: SuccessFactors tenants are
# reached by their own domain, so there is no board token to carry. The adapter
# templates https://{key}/sitemap.xml, which serves the whole board as RSS.
# `domain` stays the employer's corporate domain for company resolution.

