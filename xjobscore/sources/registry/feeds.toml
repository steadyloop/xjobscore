schema_version = 2

# Complete source registry. The array name describes who publishes the endpoint:
# - [[ats]]: a multi-tenant recruiting-system vendor
# - [[direct]]: a first-party employer careers source
# - [[board]]: an independent job, program, or community board
#
# ATS tenant feeds live under ats-catalog/. Direct and Board feeds with one
# endpoint remain inline below.

