# Life-science employers for the bioengineering focus chips (MedTech, Regulatory, BioTech).
#
# Device makers and pharma companies post most student roles under generic titles
# ("Mechanical Engineering Co-op", "Quality Engineering Intern"), so the employer is
# what makes those roles bioengineering targets. Names are matched case-insensitively
# against company.name exactly as stored -- often a raw ATS tenant key ("jj", "bdx").
# A company may sit in more than one segment.
#
# Seeded 2026-10-06 from a reviewed classification of every employer with student
# postings plus employer rosters from medtech, pharma and clinical-research career
# guides; see registry/filters/bioengineering.md. Editing this file changes
# bioengineering.focus_version(), so the Gold `focus` step recomputes every typed
# posting on its next pass.
#
# Segments:
#   dev: Medical devices and medical technology: implants, surgical robotics, cardiovascular and neuro devices, imaging,
#   diabetes and infusion, dental/vision/hearing, neurotech/BCI, regulated medical software, HTM service firms.
#   Engineering, quality, manufacturing, software and design roles -> MedTech; quality and clinical -> Regulatory.
#   dx: Diagnostics: IVD makers, genetic-testing and clinical reference labs. Engineering -> MedTech; lab science -> BioTech.
#   tools: Life-science research tools, instruments, genomics platforms and bioprocess equipment. Technical roles -> BioTech.
#   pharma: Pharma, biotech, cell and gene therapy, vaccines, animal and consumer health, synthetic biology, AI drug discovery.
#   Science, engineering and manufacturing -> BioTech; quality, regulatory and clinical -> Regulatory.
#   agbio: Ag and livestock biotech. Only research, lab, breeding and genetics roles -> BioTech (not seed production).
#   lab: CDMOs and contract testing labs. Lab, manufacturing and engineering -> BioTech; quality -> Regulatory.
#   cro: Clinical research organizations, site networks and trial technology. Clinical, quality, data and coordinator roles -> Regulatory.
#   consult: Life-science validation, quality and regulatory consultancies. Technical roles -> Regulatory (CQV also BioTech).
#   bio_institute: Biomedical research institutes. Research roles -> BioTech; clinical roles -> Regulatory.
#   aec_ls: Architecture/engineering firms that design life-science plants. Process and CQV roles only.

