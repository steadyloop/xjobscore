# Canonical skill taxonomy used to extract skills from posting text.
#
# Conventions -- keep new entries consistent with these:
#
#   category  One of: language | stack | concept.
#               language  programming languages.
#               stack     shipped software: libraries, tools, services, runtimes.
#               concept   techniques, mechanisms, hardware, and wire standards.
#             Protobuf and FlatBuffers are `stack` because they ship as libraries
#             with their own compilers; SBE, FIX, FAST, and ITCH/OUCH are
#             `concept` because they are wire standards, not software you install.
#             Interconnects and memory standards (PCIe, NVLink, InfiniBand, HBM)
#             are `concept`.
#
#   name      Display string rendered in the UI. Title Case, except where the
#             vendor's own spelling differs -- vLLM, cuBLAS, cuDNN, gRPC, eBPF,
#             ccache, gdb, strace, llama.cpp, torch.compile.
#
#   aliases   Spellings matched in posting text, case-insensitive unless
#             `case_sensitive: true`. No spelling may be claimed by two skills.
#             Prefer a dedicated entry over burying a concrete tool as an alias
#             of a broad concept: "xgboost" is its own skill, not a synonym for
#             gradient boosting.
#
#   ambiguous_aliases
#             Spellings reserved but deliberately NOT matched, because they
#             collide with ordinary English or with another skill -- "go", "c",
#             "triton". Reserving one stops another entry from claiming it.

