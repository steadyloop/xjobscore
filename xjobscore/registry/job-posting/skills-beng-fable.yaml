# Resume keywords measured across 34 bioengineering job descriptions.
#
# Scope is a fixed URL list supplied 2026-08-27, resolved against the local
# xjobscore corpus; every posting matched and carried a full description. The
# matcher is the production Aho-Corasick one in xjobscore/skills.py, run over
# the union of skills.yaml and the skills-bioeng.yaml candidate supplement.
# 169 skills matched; all 34 postings carry at least one.
#
# Organised on four resume axes rather than the eleven production categories:
#
#   techniques      what you can do at the bench or in a pipeline   (61)
#   domains         what biology, or what field, you know           (55)
#   tools-software  named products, languages, platforms            (24)
#   regulatory      quality systems, standards, clinical function   (29)
#
# These are not production category values, so this file does NOT load through
# skills._load(); it is an analysis extract. Aliases are copied verbatim from
# their source files. Within each axis entries are ordered by document
# frequency: the first entry is the one the most postings named.
#
# Alias expansion 2026-08-27: 99 aliases added across 56 skills after a
# corpus scan of 1,035 candidates. Each added alias reaches postings the skill
# did not already hit, and at least 20% of those (>=3x the 5.1% corpus base) carry
# a bio, lab, quality or clinical title. Rejected despite passing on numbers:
# 'audits', 'DNA', 'cancer', 'neural', 'SPR', 'CTA', 'NDA' -- they name something
# broader than the skill or collide with an unrelated acronym. A title review of
# the new postings then pulled 21 more that passed on numbers but not on meaning:
# QSR (restaurants), NCR (the company), PMA (aerospace), H&E, Prism, Hamilton,
# LIS, 'phase II' (project phases), 'immune' (security), 'regulatory strategy'
# and 'technology transfer' (legal), 'aseptic'/'sterile technique' (nursing),
# 'hypothesis testing'/'design experiments' (A/B testing), 'fault tree',
# 'test protocols', 'device development', 'implants', 'design outputs'.

