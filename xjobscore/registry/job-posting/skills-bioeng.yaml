# Candidate bioengineering skill taxonomy.
#
# This is a supplement to skills.yaml, not a production input.  It intentionally
# omits skills already present in the main taxonomy (for example Python, MATLAB,
# LabVIEW, statistics, signal processing, image processing, bioinformatics, and
# computational biology).  Promote reviewed entries into skills.yaml rather than
# pointing Gold at this file.
#
# Candidate selection covers biomedical devices, biotechnology, wet-lab methods,
# bioinformatics, bioprocessing, pharmaceutical development, clinical research,
# and regulated quality systems.  Aliases are global because the production
# matcher scans every posting description, not only bioengineering postings.
# Bare abbreviations that are ordinary words or overloaded outside this domain
# are therefore case-sensitive, qualified, or recorded as ambiguous.
#
# Categories use the production vocabulary: language, library, tool, platform,
# method, concept, framework, datastore, protocol, format, and hardware.
#
# Validated against the live PostgreSQL corpus (see the sections added at the
# end of the file).  Every alias added in that pass was measured first: its
# document frequency in bioengineering postings and its rate in a non-bio
# control sample.  Terms whose common sense outside this domain is something
# else -- CRO (Chief Revenue Officer), NDA (non-disclosure agreement), ADC
# (analog-to-digital converter), CSR -- are recorded as ambiguous rather than
# matched.  On the production recommendation set this file reaches 93% of
# postings with at least one skill; the residue is software and hardware
# engineering roles at bio employers, whose skills belong to skills.yaml.

