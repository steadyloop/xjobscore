schema_version = 2

# Complete source registry. The array name describes who publishes the endpoint:
# - [[ats]]: a multi-tenant recruiting-system vendor
# - [[direct]]: a first-party employer careers source
# - [[board]]: an independent job, program, or community board
#
# ATS tenant feeds live under ats-catalog/. Direct and Board feeds with one
# endpoint remain inline below.
#
# Inline rows carry only what is read at runtime. `key` defaults to `name` and
# is written out only when the adapter needs a different value. Company name
# and domain are never declared here -- they are derived from companies.toml
# via `company_id`, so the two copies cannot drift apart.
#
# A Board resolves its employer from each posting, not from the feed, so it
# declares no `company_id` at all; `description` carries the operator note.


## Independent boards and aggregators

[[board]]
name = "hn"
description = "Hacker News 'Who is hiring?' monthly thread. The employer comes from each comment header, so no company is declared here; the newest thread is discovered at poll time unless config pins a numeric story_id."
verified = true

[[board]]
name = "simplify"
key = "SimplifyJobs/Summer2027-Internships"
description = "Community-maintained new-grad and internship list on GitHub. `key` is the owner/repo path interpolated into the raw.githubusercontent URL -- bump it each season."
verified = true

[[board]]
name = "unstop"
description = "One platform-wide opportunity feed, not a per-employer tenant board."
verified = true

[[board]]
name = "usajobs"
description = "US federal job search API. Blocked: stays unverified until operator-owned credentials exist in [board.config] as api_key and ua_email. Never commit a personal Authorization-Key or registered-email User-Agent here."
verified = false
implemented = false

[[board]]
name = "workatastartup"
description = "Y Combinator's company board. Blocked: needs captured headers and body in [board.config], and has no parser registered yet."
verified = false
implemented = false


