# Unified skill canon: the single authority both sides resolve against.
#
# Job-description text (or a future job_posting.attributes.skills array) and
# resume skill-bank entries are matched by resolving through this file — never
# by comparing raw strings. One table per skill, keyed by slug.
#
#   slug (table key)  unique identity; lowercase, hyphenated
#   name              display form; defaults to the slug if omitted
#   category          exactly one of: language | stack | concept
#   aliases           alternate spellings, all lowercase; matched with the
#                     same word-boundary rule as the name
#   ambiguous         the display name has a non-technical English use, so it is
#                     excluded from matching and only the aliases resolve. With
#                     no aliases the skill is never auto-labeled at all — a
#                     deliberate miss, since a wrong label is worse than none.
#
# category meanings:
#   language  programming languages ("strong C++ required")
#   stack     software you run: frameworks, libraries, tools, infra
#   concept   things you know: techniques, theory, domain knowledge

# -- language ----------------------------------------------------------

[c]
name = "C"
category = "language"
aliases = []
ambiguous = true  # a letter, a grade, "C-level"; no spelling identifies the language

[cpp]
name = "C++"
category = "language"
aliases = ["cpp"]

[python]
name = "Python"
category = "language"
aliases = []

[cuda]
name = "CUDA"
category = "language"
aliases = []

[go]
name = "Go"
category = "language"
aliases = ["golang"]
ambiguous = true  # "go to market", "on the go"

[rust]
