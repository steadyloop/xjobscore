<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>OneShot</title>
  <link rel="stylesheet" href="/static/app.css">
  <link rel="stylesheet" href="/static/layout.css">
  <script defer src="/static/sample-data.js"></script>
  <script defer src="/static/api-client.js"></script>
  <script defer src="/static/app.js"></script>
</head>
<body>
  <svg width="0" height="0" aria-hidden="true" style="position:absolute">
    <symbol id="i-compass" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m15.4 8.6-2 4.8-4.8 2 2-4.8 4.8-2Z"/></symbol>
    <symbol id="i-pipeline" viewBox="0 0 24 24"><path d="M5 4v16M5 7h5a3 3 0 0 1 3 3v4a3 3 0 0 0 3 3h3"/><path d="m16 14 3 3-3 3"/></symbol>
    <symbol id="i-radar" viewBox="0 0 24 24"><circle cx="12" cy="12" r="2"/><path d="M12 3a9 9 0 0 1 9 9M12 7a5 5 0 0 1 5 5M5.6 5.6a9 9 0 1 0 12.8 12.8"/></symbol>
  </svg>
  <div class="app-shell">
    <aside class="rail" aria-label="Primary navigation">
      <a class="brand" href="#discover" data-view-link="discover"><span class="brand-mark">◌</span>oneshot</a>
      <nav class="nav-list">
        <p>Workspace</p>
        <a class="icon-link" href="#discover" data-view-link="discover"><svg class="nav-icon" aria-hidden="true"><use href="#i-compass"/></svg>Discover <b data-count="discover">—</b></a>
        <a class="icon-link" href="/static/discover/index.html"><svg class="nav-icon" aria-hidden="true"><use href="#i-compass"/></svg>Discover (Sample)</a>
        <a class="icon-link" href="#pipeline" data-view-link="pipeline"><svg class="nav-icon" aria-hidden="true"><use href="#i-pipeline"/></svg>Applications</a>
        <a class="icon-link" href="/static/application/index.html"><svg class="nav-icon" aria-hidden="true"><use href="#i-pipeline"/></svg>Applications (Sample)</a>
        <p>Quality</p>
        <a class="icon-link" href="#coverage" data-view-link="coverage"><svg class="nav-icon" aria-hidden="true"><use href="#i-radar"/></svg>Source coverage <b data-count="coverage">—</b></a>
      </nav>
      <button class="sample-toggle" type="button" data-action="sample-toggle" role="switch" aria-checked="false" aria-label="Turn on sample data">
        <span class="sample-toggle-copy">Sample data<small>Off</small></span>
        <span class="sample-switch" aria-hidden="true"><i></i></span>
      </button>
    </aside>

    <main class="main">
      <div id="flash" class="flash" role="status" aria-live="polite"></div>
      <section id="view" class="view" aria-live="polite">
        <div class="state loading"><i></i><h1>Loading your workspace</h1><p>Reading the latest API data.</p></div>
      </section>
    </main>
  </div>
  <div id="modal-root"></div>
</body>
</html>
