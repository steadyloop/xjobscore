[project]
name = "xjobscore-oneshot-ui"
version = "0.2.0"
description = "A PostgreSQL-backed job discovery and application workspace"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.29",
    "fastapi>=0.141.1",
    "pydantic>=2.0",
    "uvicorn>=0.52.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [".", "../.."]

[tool.setuptools]
packages = ["oneshot_ui"]

[tool.setuptools.package-data]
oneshot_ui = ["static/*", "static/**/*"]
