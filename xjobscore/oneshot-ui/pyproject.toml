[project]
name = "xjobscore-oneshot-ui"
version = "0.1.0"
description = "A local unified, deduplicated job discovery and application board"
requires-python = ">=3.12"
dependencies = [
    # CatalogDB's package import loads the existing inspector/router modules,
    # whose PostgreSQL type annotations require this client at import time.
    # OneShot itself never opens PostgreSQL; all of its writes are SQLite.
    "asyncpg>=0.29",
    "fastapi>=0.141.1",
    "httpx>=0.27",
    "uvicorn>=0.52.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [".", "../.."]

[tool.setuptools]
packages = ["oneshot_ui"]

[tool.setuptools.package-data]
oneshot_ui = ["static/*"]
