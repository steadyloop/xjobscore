[project]
name = "xjobscore-oneshot-ui"
version = "0.2.0"
description = "A PostgreSQL-backed job discovery and application workspace"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.29",
    "fastapi>=0.141.1",
    # Runtime, not just tests: the Google OAuth token exchange runs over httpx.
    # The Dockerfile installs this project without dev groups, so a dev-only
    # httpx imports fine locally and breaks only in the container.
    "httpx>=0.27",
    # Required by Starlette's SessionMiddleware, which signs the session cookie.
    "itsdangerous>=2.0",
    "playwright>=1.55",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    # The Typst compiler itself, as a binary wheel (manylinux + macOS, x86_64
    # and arm64). It replaced a system `typst` binary the Dockerfile fetched
    # from GitHub and every developer had to `brew install` — with the compiler
    # pinned by the lockfile, typesetting can no longer drift between machines,
    # which matters for a template tuned to fit exactly one page.
    "typst>=0.15",
    "uvicorn>=0.52.0",
    "xjobscore",
]

[tool.uv.sources]
xjobscore = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [".", "../.."]

[tool.setuptools]
packages = ["oneshot_ui"]

# The resume fonts ride inside the package so the container typesets with the
# same faces as a laptop; without this the wheel ships the .py files only.
[tool.setuptools.package-data]
oneshot_ui = ["fonts/*.ttf", "fonts/OFL.txt"]
