  "datePosted": "2026-07-15",
  "description": "<div><div><p style=\"margin: 0.0pt;\"><span style=\"font-family: sans-serif , arial , helvetica;\"><span style=\"font-size: 14.0pt;font-weight: bold;\">VP, C</span><span style=\"font-size: 14.0pt;font-weight: bold;\">ORPORATE</span><span style=\"font-size: 14.0pt;font-weight: bold;\"> FP&amp;A</span></span></p><p style=\"margin: 0.0pt;\"><span style=\"font-family: sans-serif , arial , helvetica;\"><span style=\"font-size: 14.0pt;font-weight: bold;\">MOUNTAIN VIEW,</span><span style=\"font-size: 14.0pt;font-weight: bold;\">\u00a0</span><span style=\"font-size: 14.0pt;font-weight: bold;\">CA \u2013 HYBRID,</span><span style=\"font-size: 14.0pt;font-weight: bold;\">\u00a0</span><span style=\"font-size: 14.0pt;font-weight: bold;\">3 DAYS PER WEEK IN OFFICE</span></span></p><p style=\"margin: 0.0pt;\"><span style=\"font-family: sans-serif , arial , helvetica;font-size: 14.0pt;font-weight: bold;\">\u00a0</span></p><p style=\"margin: 0.0pt;\"><span style=\"font-family: sans-serif , arial , helvetica;font-size: 14.0pt;font-weight: bold;\">EGNYTE YOUR CAREER. SPARK YOUR PASSION.</span></p><p style=\"margin: 0.0pt;\"><span style=\"font-family: sans-serif , arial , helvetica;\"><span style=\"font-size: 14.0pt;\">Egnyte is a place where we spark opportunities for amazing people. We believe that every role has</span><span style=\"font-size: 14.0pt;\">\u00a0</span><span style=\"font-size: 14.0pt;\">a great impact, and every</span><span style=\"font-size: 14.0pt;\">\u00a0</span><span style=\"font-size: 14.0pt;\">Egnyter</span><span style=\"font-size: 14.0pt;\">\u00a0</span><span style=\"font-size: 14.0pt;\">should be respected. When joining Egnyte,</span><span style=\"font-size: 14.0pt;\">\u00a0</span><span style=\"font-size: 14.0pt;\">you\u2019re</span><span style=\"font-size: 14.0pt;\">\u00a0</span><span style=\"font-size: 14.0pt;\">not just landing a new career, you become part of a team of</span><span style=\"font-size: 14.0pt;\">\u00a0</span><span style=\"font-size: 14.0pt;\">Egnyters</span><span style=\"font-size: 14.0pt;\">\u00a0</span><span style=\"font-size: 14.0pt;\">that are doers, thinkers, and collaborators who embrace and live by our values:</span></span></p><ul style=\"margin: 0.0pt;padding-left: 0.0pt;\"><li style=\"font-family: sans-serif , arial , helvetica;font-size: 14.0pt;margin: 0.0pt 0.0pt 0.0pt 9.9pt;padding-left: 8.1pt;text-indent: 0.0pt;\"><span style=\"font-family: sans-serif , arial , helvetica;font-size: 14.0pt;\">Invested Relationships</span></li><li style=\"font-family: sans-serif , arial , helvetica;font-size: 14.0pt;margin: 0.0pt 0.0pt 0.0pt 9.9pt;padding-left: 8.1pt;text-indent: 0.0pt;\"><span style=\"font-family: sans-serif , arial , helvetica;font-size: 14.0pt;\">Fiscal Prudence</span></li><li style=\"font-family: sans-serif , arial , helvetica;font-size: 14.0pt;margin: 0.0pt 0.0pt 0.0pt 9.9pt;padding-left: 8.1pt;text-indent: 0.0pt;\"><span style=\"font-family: sans-serif , arial , helvetica;font-size: 14.0pt;\">Candid Conversations</span></li></ul><p style=\"margin: 0.0pt;\"><span style=\"font-family: sans-serif , arial , helvetica;font-size: 14.0pt;font-weight: bold;\">\u00a0</span></p><p style=\"margin: 0.0pt;\"><span style=\"font-family: sans-serif , arial , helvetica;font-size: 14.0pt;font-weight: bold;\">ABOUT EGNYTE</span></p><p style=\"margin: 0.0pt;\"><span style=\"font-family: sans-serif , arial , helvetica;\"><span style=\"font-size: 14.0pt;\">Egnyte is the secure multi-cloud platform for content security and governance that enables organizations to better protect and collaborate on their most valuable content. Established in 2008, Egnyte has democratized cloud content security for more than 22,000 organizations, helping customers improve data security,</span><span style=\"font-size: 14.0pt;\">\u00a0</span><span style=\"font-size: 14.0pt;\">maintain</span><span style=\"font-size: 14.0pt;\">\u00a0</span><span style=\"font-size: 14.0pt;\">compliance, prevent and detect ransomware threats, and boost employee productivity on any app, any cloud, anywhere. For more information, visit</span><span style=\"font-size: 14.0pt;\">\u00a0</span><a style=\"color: rgb(0,0,0);\" href=\"http://www.egnyte.com/\" target=\"_blank\"><span style=\"font-size: 14.0pt;text-decoration: underline;\">www.egnyte.com</span></a><span style=\"font-size: 14.0pt;\">.</span></span></p><p style=\"margin: 0.0pt;\"><span style=\"font-family: sans-serif , arial , helvetica;font-size: 14.0pt;\">\u00a0</span></p><p style=\"margin: 0.0pt;\"><span style=\"font-family: sans-serif , arial , helvetica;\"><span style=\"background-color: rgb(255,255,255);font-size: 14.0pt;\">Egnyte is seeking a Vice President of Corporate FP&amp;A to serve as a strategic partner to the CFO and executive team driving scalable growth by connecting financial forecasting with deep data insights and operational efficiency. Reporting directly to the CFO, you will lead Egnyte\u2019s FP&amp;A, decision support, and reporting functions, owning the financial narrative that guides how we invest, scale, and win in the market.</span><span style=\"background-color: rgb(255,255,255);font-size: 14.0pt;\">\u00a0</span><span style=\"background-color: rgb(255,255,255);font-size: 14.0pt;\"> You will not just oversee</span><span style=\"background-color: rgb(255,255,255);font-size: 14.0pt;\">\u00a0</span><span style=\"background-color: rgb(255,255,255);font-size: 14.0pt;\">numbers,</span><span style=\"background-color: rgb(255,255,255);font-size: 14.0pt;\">\u00a0</span><span style=\"background-color: rgb(255,255,255);font-size: 14.0pt;\">you will shape the financial and operational architecture of a high-growth SaaS company. If you are a self-starter who is fueled by a fast-paced, collaborative environment and can seamlessly translate complex data into actionable executive strategy, we want to \u201cspark\u201d a conversation with you.</span></span></p><p style=\"margin: 0.0pt;\"><span style=\"font-family: sans-serif , arial , helvetica;font-size: 14.0pt;font-weight: bold;\">\u00a0</span></p><p style=\"margin: 0.0pt;\"><span style=\"font-family: sans-serif , arial , helvetica;font-size: 14.0pt;font-weight: bold;\">WHAT YOU\u2019LL DO</span></p><ul style=\"margin: 0.0pt;padding-left: 0.0pt;\"><li style=\"font-family: sans-serif , arial , helvetica;font-size: 14.0pt;margin: 0.0pt 0.0pt 0.0pt 9.9pt;padding-left: 8.1pt;text-indent: 0.0pt;\"><span style=\"font-family: sans-serif , arial , helvetica;\"><span style=\"font-size: 14.0pt;\">Oversee comprehensive planning and for</span><span style=\"font-size: 14.0pt;\">ecasting, including long-range planning (LRP), annual operating planning (AOP), and rolling quarterly forecasts</span></span></li><li style=\"font-family: sans-serif , arial , helvetica;font-size: 14.0pt;margin: 0.0pt 0.0pt 0.0pt 9.9pt;padding-left: 8.1pt;text-indent: 0.0pt;\"><span style=\"font-family: sans-serif , arial , helvetica;font-size: 14.0pt;\">Own and manage the master P&amp;L, B/S and C/F model incorporating inputs from various departments and making final judgment in partnership with the CFO</span></li><li style=\"font-family: sans-serif , arial , helvetica;font-size: 14.0pt;margin: 0.0pt 0.0pt 0.0pt 9.9pt;padding-left: 8.1pt;text-indent: 0.0pt;\"><span style=\"font-family: sans-serif , arial , helvetica;font-size: 14.0pt;\">Drive and lead the financial execution of the company by ensuring that all risks/opportunities are addressed dynamically to hit final goals</span></li><li style=\"font-family: sans-serif , arial , helvetica;font-size: 14.0pt;margin: 0.0pt 0.0pt 0.0pt 9.9pt;padding-left: 8.1pt;text-indent: 0.0pt;\"><span style=\"font-family: sans-serif , arial , helvetica;\"><span style=\"font-size: 14.0pt;\">Develop and present sophisticated internal and external reporting packages for executi</span><span style=\"font-size: 14.0pt;\">ve leadership, investors, lenders, and the Board of Directors</span></span></li><li style=\"font-family: sans-serif , arial , helvetica;font-size: 14.0pt;margin: 0.0pt 0.0pt 0.0pt 9.9pt;padding-left: 8.1pt;text-indent: 0.0pt;\"><span style=\"font-family: sans-serif , arial , helvetica;font-size: 14.0pt;\">Hire, manage and develop talent to continually build a high performing corporate finance function that scales with the company</span></li><li style=\"font-family: sans-serif , arial , helvetica;font-size: 14.0pt;margin: 0.0pt 0.0pt 0.0pt 9.9pt;padding-left: 8.1pt;text-indent: 0.0pt;\"><span style=\"font-family: sans-serif , arial , helvetica;font-size: 14.0pt;\">Evaluate the financial viability and strategic fit of new product launches, international expansion, M&amp;A, and business model evolutions</span></li><li style=\"font-family: sans-serif , arial , helvetica;font-size: 14.0pt;margin: 0.0pt 0.0pt 0.0pt 9.9pt;padding-left: 8.1pt;text-indent: 0.0pt;\"><span style=\"font-family: sans-serif , arial , helvetica;font-size: 14.0pt;\">Deliver deep-dive analysis on revenue drivers, expense optimization, and overall risk/opportunity management</span></li><li style=\"font-family: sans-serif , arial , helvetica;font-size: 14.0pt;margin: 0.0pt 0.0pt 0.0pt 9.9pt;padding-left: 8.1pt;text-indent: 0.0pt;\"><span style=\"font-family: sans-serif , arial , helvetica;font-size: 14.0pt;\">Contribute to global procurement strategy to optimize vendor management, negotiate high-value software/infrastructure contracts, and drive cost efficiencies</span></li><li style=\"font-family: sans-serif , arial , helvetica;font-size: 14.0pt;margin: 0.0pt 0.0pt 0.0pt 9.9pt;padding-left: 8.1pt;text-indent: 0.0pt;\"><span style=\"font-family: sans-serif , arial , helvetica;font-size: 14.0pt;\">Implement scalable workflows and compliance guardrails that match Egnyte\u2019s growth trajectory without sacrificing speed</span></li><li style=\"font-family: sans-serif , arial , helvetica;font-size: 14.0pt;margin: 0.0pt 0.0pt 0.0pt 9.9pt;padding-left: 8.1pt;text-indent: 0.0pt;\"><span style=\"font-family: sans-serif , arial , helvetica;font-size: 14.0pt;\">Oversee the creation of centralized BI dashboards and unified SaaS metrics to drive consistency across all business units</span></li><li style=\"font-family: sans-serif , arial , helvetica;font-size: 14.0pt;margin: 0.0pt 0.0pt 0.0pt 9.9pt;padding-left: 8.1pt;text-indent: 0.0pt;\"><span style=\"font-family: sans-serif , arial , helvetica;font-size: 14.0pt;\">Core business partner for Corporate, G&amp;A and R&amp;D functions \u2013 especially budgeting and headcount</span></li><li style=\"font-family: sans-serif , arial , helvetica;font-size: 14.0pt;margin: 0.0pt 0.0pt 0.0pt 9.9pt;padding-left: 8.1pt;text-indent: 0.0pt;\"><span style=\"font-family: sans-serif , arial , helvetica;font-size: 14.0pt;\">Optimize vendor management, negotiate high-value software/infrastructure contracts, and drive global cost efficiencies</span></li></ul><p style=\"margin: 0.0pt;\"><span style=\"font-family: sans-serif , arial , helvetica;font-size: 14.0pt;font-weight: bold;\">\u00a0</span></p><p style=\"margin: 0.0pt;\"><span style=\"background-color: rgb(255,255,255);font-family: sans-serif , arial , helvetica;font-size: 14.0pt;font-weight: bold;\">YOUR QUALIFICATIONS:</span></p><ul style=\"margin: 0.0pt;padding-left: 0.0pt;\"><li style=\"font-family: sans-serif , arial , helvetica;font-size: 14.0pt;margin: 0.0pt 0.0pt 0.0pt 9.9pt;padding-left: 8.1pt;text-indent: 0.0pt;\"><span style=\"font-family: sans-serif , arial , helvetica;font-size: 14.0pt;\">Bachelor\u2019s degree in Finance, Accounting, Economics, Business, or a related field</span></li><li style=\"font-family: sans-serif , arial , helvetica;font-size: 14.0pt;margin: 0.0pt 0.0pt 0.0pt 9.9pt;padding-left: 8.1pt;text-indent: 0.0pt;\"><span style=\"font-family: sans-serif , arial , helvetica;\"><span style=\"font-size: 14.0pt;\">10+ years of progressive finance experience, including </span><span style=\"font-size: 14.0pt;\">5+ years in an executive leadership role</span><span style=\"font-size: 14.0pt;\"> within a high-growth SaaS or technology company</span></span></li><li style=\"font-family: sans-serif , arial , helvetica;font-size: 14.0pt;margin: 0.0pt 0.0pt 0.0pt 9.9pt;padding-left: 8.1pt;text-indent: 0.0pt;\"><span style=\"font-family: sans-serif , arial , helvetica;font-size: 14.0pt;\">Deep understanding of SaaS subscription models, revenue recognition, pipeline mechanics, and operational KPIs</span></li><li style=\"font-family: sans-serif , arial , helvetica;font-size: 14.0pt;margin: 0.0pt 0.0pt 0.0pt 9.9pt;padding-left: 8.1pt;text-indent: 0.0pt;\"><span style=\"font-family: sans-serif , arial , helvetica;\"><span style=\"font-size: 14.0pt;\">Expert proficiency with corporate planning platforms, ERPs, CRMs, and Analytics tools (</span><span style=\"font-size: 14.0pt;\">preference with</span><span style=\"font-size: 14.0pt;\"> </span><span style=\"font-size: 14.0pt;\">Anaplan, NetSuite, Salesforce, Excel, and Tableau</span><span style=\"font-size: 14.0pt;\">)</span></span></li><li style=\"font-family: sans-serif , arial , helvetica;font-size: 14.0pt;margin: 0.0pt 0.0pt 0.0pt 9.9pt;padding-left: 8.1pt;text-indent: 0.0pt;\"><span style=\"font-family: sans-serif , arial , helvetica;font-size: 14.0pt;\">Demonstrated success building, mentoring, and developing high-performing, multi-disciplinary teams</span></li><li style=\"font-family: sans-serif , arial , helvetica;font-size: 14.0pt;margin: 0.0pt 0.0pt 0.0pt 9.9pt;padding-left: 8.1pt;text-indent: 0.0pt;\"><span style=\"font-family: sans-serif , arial , helvetica;font-size: 14.0pt;\">Exceptional capability to articulate complex financial and data concepts clearly to both technical teams and C-suite executives/Board members</span></li><li style=\"font-family: sans-serif , arial , helvetica;font-size: 14.0pt;margin: 0.0pt 0.0pt 0.0pt 9.9pt;padding-left: 8.1pt;text-indent: 0.0pt;\"><span style=\"font-family: sans-serif , arial , helvetica;font-size: 14.0pt;\">Willingness to work 3 days per week in our Mountain View, CA office.</span></li></ul><p style=\"margin: 0.0pt;\"><span style=\"font-family: sans-serif , arial , helvetica;font-size: 14.0pt;\">\u00a0</span></p><p style=\"margin: 0.0pt 0.0pt 0.0pt 18.0pt;\"><span style=\"font-family: sans-serif , arial , helvetica;font-size: 14.0pt;font-weight: bold;\">Preferred Qualifications</span></p><ul style=\"margin: 0.0pt;padding-left: 0.0pt;\"><li style=\"font-family: sans-serif , arial , helvetica;font-size: 14.0pt;margin: 0.0pt 0.0pt 0.0pt 49.4pt;padding-left: 4.6pt;text-indent: 0.0pt;\"><span style=\"font-family: sans-serif , arial , helvetica;\"><span style=\"font-size: 14.0pt;\">MBA, Master\u2019s degree in a business field, or </span><span style=\"font-size: 14.0pt;\">CPA</span><span style=\"font-size: 14.0pt;\"> designation.</span></span></li><li style=\"font-family: sans-serif , arial , helvetica;font-size: 14.0pt;margin: 0.0pt 0.0pt 0.0pt 49.4pt;padding-left: 4.6pt;text-indent: 0.0pt;\"><span style=\"font-family: sans-serif , arial , helvetica;font-size: 14.0pt;\">Background in leading high performing finance teams and delivering financial goals</span></li><li style=\"font-family: sans-serif , arial , helvetica;font-size: 14.0pt;margin: 0.0pt 0.0pt 0.0pt 49.4pt;padding-left: 4.6pt;text-indent: 0.0pt;\"><span style=\"font-family: sans-serif , arial , helvetica;font-size: 14.0pt;\">Deep understanding of cloud markets, content collaboration, data governance, and security sectors</span></li><li style=\"font-family: sans-serif , arial , helvetica;font-size: 14.0pt;margin: 0.0pt 0.0pt 0.0pt 49.4pt;padding-left: 4.6pt;text-indent: 0.0pt;\"><span style=\"font-family: sans-serif , arial , helvetica;font-size: 14.0pt;\">Proven ability to own outcomes in fast-paced, ambiguous environments\u2014driving decisions proactively without waiting for direction</span></li></ul><p style=\"margin: 0.0pt;\"><span style=\"font-family: sans-serif , arial , helvetica;font-size: 14.0pt;\">\u00a0</span></p><p style=\"margin: 0.0pt;\"><span style=\"font-family: sans-serif , arial , helvetica;font-size: 14.0pt;font-weight: bold;\">COMPENSATION:</span></p><ul style=\"margin: 0.0pt;padding-left: 0.0pt;\"><li style=\"font-family: sans-serif , arial , helvetica;font-size: 14.0pt;margin: 0.0pt 0.0pt 0.0pt 9.9pt;padding-left: 8.1pt;text-indent: 0.0pt;\"><span style=\"font-family: sans-serif , arial , helvetica;\"><span style=\"font-size: 14.0pt;\">Our compensation reflects the cost of labor across multiple U.S. geographic</span><span style=\"font-size: 14.0pt;\">\u00a0</span><span style=\"font-size: 14.0pt;\">locations, and</span><span style=\"font-size: 14.0pt;\">\u00a0</span><span style=\"font-size: 14.0pt;\">pay varies based on defined markets. The standard base pay range for this position</span><span style=\"font-size: 14.0pt;\">\u202f</span><span style=\"font-size: 14.0pt;\">across the U.S. is $</span><span style=\"font-size: 14.0pt;\">280</span><span style=\"font-size: 14.0pt;\">k</span><span style=\"font-size: 14.0pt;\">\u00a0</span><span style=\"font-size: 14.0pt;\">- $</span><span style=\"font-size: 14.0pt;\">315</span><span style=\"font-size: 14.0pt;\">k</span><span style=\"font-size: 14.0pt;\">\u00a0</span><span style=\"font-size: 14.0pt;\">annually.</span><span style=\"font-size: 14.0pt;\">\u00a0</span><span style=\"font-size: 14.0pt;\">Pay</span><span style=\"font-size: 14.0pt;\">\u202f</span><span style=\"font-size: 14.0pt;\">varies by work location</span><span style=\"font-size: 14.0pt;\">\u202f</span><span style=\"font-size: 14.0pt;\">and may also be dependent on job-related skills, knowledge,</span><span style=\"font-size: 14.0pt;\">\u202f</span><span style=\"font-size: 14.0pt;\">and/or experience.</span><span style=\"font-size: 14.0pt;\">\u00a0</span><span style=\"font-size: 14.0pt;\">During the interview and/or hiring process, your recruiter can share more information about the compensation package specific to the role and job location.</span></span></li></ul><p style=\"margin: 0.0pt;\"><span style=\"font-family: sans-serif , arial , helvetica;font-size: 14.0pt;\">\u00a0</span></p><p style=\"margin: 0.0pt;\"><span style=\"font-family: sans-serif , arial , helvetica;font-size: 14.0pt;font-weight: bold;\">BENEFITS:</span></p><ul style=\"margin: 0.0pt;padding-left: 0.0pt;\"><li style=\"font-family: sans-serif , arial , helvetica;font-size: 14.0pt;margin: 0.0pt 0.0pt 0.0pt 9.9pt;padding-left: 8.1pt;text-indent: 0.0pt;\"><span style=\"font-family: sans-serif , arial , helvetica;font-size: 14.0pt;\">Competitive salaries and comprehensive benefits</span></li><li style=\"font-family: sans-serif , arial , helvetica;font-size: 14.0pt;margin: 0.0pt 0.0pt 0.0pt 9.9pt;padding-left: 8.1pt;text-indent: 0.0pt;\"><span style=\"font-family: sans-serif , arial , helvetica;\"><span style=\"font-size: 14.0pt;\">Flexible hours and generous time off (RTO, Responsible Time Off) to help support your work-life balance</span><span style=\"font-size: 14.0pt;\">\u00a0</span></span></li><li style=\"font-family: sans-serif , arial , helvetica;font-size: 14.0pt;margin: 0.0pt 0.0pt 0.0pt 9.9pt;padding-left: 8.1pt;text-indent: 0.0pt;\"><span style=\"font-family: sans-serif , arial , helvetica;font-size: 14.0pt;\">Paid holidays and sick time</span></li><li style=\"font-family: sans-serif , arial , helvetica;font-size: 14.0pt;margin: 0.0pt 0.0pt 0.0pt 9.9pt;padding-left: 8.1pt;text-indent: 0.0pt;\"><span style=\"font-family: sans-serif , arial , helvetica;\"><span style=\"font-size: 14.0pt;\">401(k) with company match</span><span style=\"font-size: 14.0pt;\">\u00a0</span></span></li><li style=\"font-family: sans-serif , arial , helvetica;font-size: 14.0pt;margin: 0.0pt 0.0pt 0.0pt 9.9pt;padding-left: 8.1pt;text-indent: 0.0pt;\"><span style=\"font-family: sans-serif , arial , helvetica;font-size: 14.0pt;\">Health Savings Account (HSA) with a generous employer contribution and Flexible Spending Account (FSA) options</span></li><li style=\"font-family: sans-serif , arial , helvetica;font-size: 14.0pt;margin: 0.0pt 0.0pt 0.0pt 9.9pt;padding-left: 8.1pt;text-indent: 0.0pt;\"><span style=\"font-family: sans-serif , arial , helvetica;font-size: 14.0pt;\">Up to 12wks of paid Parental and 10wks Adoption Leave to help you grow your family</span></li><li style=\"font-family: sans-serif , arial , helvetica;font-size: 14.0pt;margin: 0.0pt 0.0pt 0.0pt 9.9pt;padding-left: 8.1pt;text-indent: 0.0pt;\"><span style=\"font-family: sans-serif , arial , helvetica;\"><span style=\"font-size: 14.0pt;\">Modern and collaborative offices</span><span style=\"font-size: 14.0pt;\">\u00a0</span><span style=\"font-size: 14.0pt;\">located</span><span style=\"font-size: 14.0pt;\">\u00a0</span><span style=\"font-size: 14.0pt;\">in Draper, UT; Raleigh, NC; Mountain View, CA; and Poznan, Poland</span></span></li><li style=\"font-family: sans-serif , arial , helvetica;font-size: 14.0pt;margin: 0.0pt 0.0pt 0.0pt 9.9pt;padding-left: 8.1pt;text-indent: 0.0pt;\"><span style=\"font-family: sans-serif , arial , helvetica;font-size: 14.0pt;\">Gym, cell phone, and internet reimbursement</span></li><li style=\"font-family: sans-serif , arial , helvetica;font-size: 14.0pt;margin: 0.0pt 0.0pt 0.0pt 9.9pt;padding-left: 8.1pt;text-indent: 0.0pt;\"><span style=\"font-family: sans-serif , arial , helvetica;font-size: 14.0pt;\">Free well-being apps such as Spring Health for Guardian are offered, as well access to our Employee Assistance Program (EAP)</span></li><li style=\"font-family: sans-serif , arial , helvetica;font-size: 14.0pt;margin: 0.0pt 0.0pt 0.0pt 9.9pt;padding-left: 8.1pt;text-indent: 0.0pt;\"><span style=\"font-family: sans-serif , arial , helvetica;\"><span style=\"font-size: 14.0pt;\">Perks</span><span style=\"font-size: 14.0pt;\">\u00a0</span><span style=\"font-size: 14.0pt;\">include discounted pet insurance, electronics, theme park tickets, travel, plus more</span></span></li><li style=\"font-family: sans-serif , arial , helvetica;font-size: 14.0pt;margin: 0.0pt 0.0pt 0.0pt 9.9pt;padding-left: 8.1pt;text-indent: 0.0pt;\"><span style=\"font-family: sans-serif , arial , helvetica;font-size: 14.0pt;\">Your own Egnyte account with lifetime access</span></li><li style=\"font-family: sans-serif , arial , helvetica;font-size: 14.0pt;margin: 0.0pt 0.0pt 0.0pt 9.9pt;padding-left: 8.1pt;text-indent: 0.0pt;\"><span style=\"font-family: sans-serif , arial , helvetica;\"><span style=\"font-size: 14.0pt;\">HealthJoy</span><span style=\"font-size: 14.0pt;\">\u00a0</span><span style=\"font-size: 14.0pt;\">\u2013 a benefits navigation app that lets you access your benefits and get answers to your questions all in one place</span></span></li><li style=\"font-family: sans-serif , arial , helvetica;font-size: 14.0pt;margin: 0.0pt 0.0pt 0.0pt 9.9pt;padding-left: 8.1pt;text-indent: 0.0pt;\"><span style=\"font-family: sans-serif , arial , helvetica;font-size: 14.0pt;\">One Medical virtual care, providing you with healthcare access across the country</span></li></ul><p style=\"margin: 0.0pt 0.0pt 0.0pt 18.0pt;\"><span style=\"font-family: sans-serif , arial , helvetica;font-size: 14.0pt;\">\u00a0</span></p><p style=\"margin: 0.0pt;\"><span style=\"font-family: sans-serif , arial , helvetica;\"><span style=\"font-size: 14.0pt;font-weight: bold;\">Equal Employment Opportunity</span><span style=\"font-size: 14.0pt;\">\u00a0</span></span><br /><span style=\"font-family: sans-serif , arial , helvetica;font-size: 14.0pt;\">Egnyte, Inc. is an Equal Opportunity Employer that does not discriminate on the basis of actual or perceived race, color, creed, religion, national origin, ancestry, citizenship status, age, sex or gender (including pregnancy, childbirth, pregnancy-related conditions, and lactation), gender identity or expression (including transgender status), sexual orientation, marital status, military service and veteran status, physical or mental disability, genetic information, or any other characteristic protected by applicable federal, state, or local laws and ordinances. Egnyt
