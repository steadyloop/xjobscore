[project]
name = "xjobscore"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.29",
    "duckdb>=1.0",
    "fastapi>=0.141.1",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "uvicorn>=0.52.0",
]

[project.scripts]
keyscan = "xjobscore.keyscan:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

# An application, not a library: seeds/, notebooks/ and friends are not packages,
# so name the packages rather than let flat-layout autodiscovery guess. viewer/
# and cc_ats/ still resolve from the repo root and are deliberately not listed.
[tool.setuptools]
packages = [
    "xjobscore",
    "xjobscore.inspector",
    "xjobscore.keyscan",
    "xjobscore.sources",
    "xjobscore.sources.planned",
    "xjobscore.sources.registry",
    "xjobscore.sources.unified_v2",
]

# Registry TOML is package data consumed by sources.registry.loader.
[tool.setuptools.package-data]
xjobscore = [
    "fixtures/*.json",
    "registry/*.toml",
    "sources/registry/*.toml",
    "sources/registry/ats-catalog/*.toml",
    "inspector/static/**/*",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Live tests hit the real vendor APIs, so they are drift canaries, not part of
# the default suite: a board going quiet must not read as a code defect.
markers = ["live: hits a real vendor API; skipped unless XJOBSCORE_LIVE=1"]
