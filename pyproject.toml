[project]
name = "xjobscore"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.29",
    "duckdb>=1.0",
    "fastapi>=0.141.1",
    "httpx>=0.27",
    "orjson>=3.10",
    "pyyaml>=6.0",
    "selectolax>=0.3",
    "uvicorn>=0.52.0",
]

[project.scripts]
keyscan = "keyscan:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

# An application, not a library: seeds/, notebooks/ and friends are not packages,
# so name the packages rather than let flat-layout autodiscovery guess. viewer/
# and cc_ats/ still resolve from the repo root and are deliberately not listed.
[tool.setuptools]
packages = [
    "keyscan",
    "xjobscore",
    "xjobscore.inspector",
    "xjobscore.sources",
    "xjobscore.sources.planned",
    "xjobscore.sources.unified_v2",
]

# Registry files are package data consumed by their respective loaders. registry/
# is data only -- no __init__.py -- so every subdirectory needs its own pattern.
[tool.setuptools.package-data]
xjobscore = [
    "fixtures/*.json",
    "registry/*.toml",
    "registry/ats-catalog/*.toml",
    "registry/job-posting/*.yaml",
    "inspector/static/**/*",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Live tests hit the real vendor APIs, so they are drift canaries, not part of
# the default suite: a board going quiet must not read as a code defect.
markers = ["live: hits a real vendor API; skipped unless XJOBSCORE_LIVE=1"]
