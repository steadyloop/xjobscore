[project]
name = "xjobscore"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.29",
    "duckdb>=1.0",
    "fastapi>=0.141.1",
    "geonamescache>=3.0",
    "httpx>=0.27",
    "orjson>=3.10",
    "pillow>=10.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "uvicorn>=0.52.0",
]

[project.scripts]
keyscan = "keyscan:main"
location-normalizer = "xjobscore.location_normalizer:main"
xjobscore = "xjobscore.system:cli"
xjobscore-backup = "xjobscore.backup:cli"

[tool.uv.sources]
xjobscore-oneshot-ui = { workspace = true }

[tool.uv.workspace]
members = ["xjobscore/oneshot-ui"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    # Root tests import oneshot_ui, and `uv run -m oneshot_ui` needs it installed.
    "xjobscore-oneshot-ui",
]

# An application, not a library: seeds/, notebooks/ and friends are not packages,
# so name the packages rather than let flat-layout autodiscovery guess.
[tool.setuptools]
packages = [
    "keyscan",
    "xjobscore",
    "xjobscore.inspector",
    "xjobscore.sources",
    "xjobscore.sources.planned",
    "xjobscore.sources.unified_v2",
]

[tool.setuptools.package-data]
xjobscore = [
    "fixtures/*.json",
    "registry/job-posting/*.yaml",
    "inspector/static/**/*",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Live tests hit the real vendor APIs, so they are drift canaries, not part of
# the default suite: a board going quiet must not read as a code defect.
markers = ["live: hits a real vendor API; skipped unless XJOBSCORE_LIVE=1"]
