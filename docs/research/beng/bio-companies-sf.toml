# Biotechnology, pharmaceutical, diagnostics, medtech, and life-sciences-tools
# companies with a headquarters or major R&D/manufacturing site anywhere in the
# San Francisco Bay Area (San Francisco, South San Francisco/San Mateo County,
# East Bay, Peninsula/South Bay, and North Bay). Same schema as
# sources/registry/companies.toml; not referenced by feeds.toml or loader.py,
# so it is a standalone candidate/reference list, not part of the harvested
# registry.
#
# Compiled by parallel web-search research agents (Sonnet 5, August 2026), not
# hand-verified. verified = false throughout, matching the convention in
# companies.toml. The long tail of small private/early-stage companies
# (particularly Berkeley/Emeryville synthetic-biology and food-tech startups)
# is more likely to contain stale, merged/acquired, or mis-attributed entries
# than the well-known public anchors — spot-check before relying on any one
# entry. Several entries are internal R&D/manufacturing sites of companies
# headquartered elsewhere (e.g. Pfizer, Bayer, Roche, Thermo Fisher); these are
# noted in the description rather than split into a separate field.

