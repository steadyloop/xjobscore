# Life-science / bio-sector companies. Same schema as sources/registry/companies.toml.

# industry labels (single label; classify by the vertical/problem served, not the
# delivery model — e.g. Ramp is fintech, not enterprise_saas):
#
#   ai_ml                    - AI/ML models, infra, or AI-first products
#   developer_tools          - devtools, cloud/infra, APIs, observability
#   data_analytics           - data platforms, BI, ETL, databases
#   cybersecurity            - security products and services
#   enterprise_saas          - B2B software with no clearer vertical fit
#   consumer                 - consumer apps, social, marketplaces
#   fintech                  - payments, banking, lending, accounting
#   crypto_web3              - blockchain, exchanges, protocols
#   insurance                - insurtech, carriers, brokers
#   investment               - VC, PE, asset management, trading firms
#   healthcare               - care delivery, health tech, medical devices
#   biotech_pharma           - drug discovery, therapeutics, lab science
#   edtech                   - education and learning
#   hr_recruiting            - hiring, HR, payroll, workforce tools
#   legal_govtech            - legal tech, compliance, government software
#   real_estate              - proptech, construction tech, housing
#   ecommerce_retail         - online/offline retail and enabling tech
#   marketing_adtech         - marketing, ads, sales tools, CRM
#   media_gaming             - media, entertainment, games, creator tools
#   travel_hospitality       - travel, lodging, restaurants, events
#   robotics_hardware        - robots, devices, semiconductors, hardware
#   aerospace_defense        - space, aviation, defense
#   transportation_logistics - mobility, automotive, freight, delivery
#   energy_climate           - energy, climate tech, sustainability
#   manufacturing_industrial - manufacturing, industrial tech, materials
#   agriculture_food         - agtech, food production, food brands
#   other                    - real company, fits no label above
#   unknown                  - not yet classified / undecidable

